<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>はなりきしゲームズ</title>
<link rel="icon" href="parts/icon-192.png">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; background: #f6e7b8; color: #3a2a10;
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  }
  main { max-width: 520px; margin: 0 auto; padding: 24px 16px; }
  h1 { text-align: center; font-size: 26px; margin: 8px 0 24px; }
  a.card {
    display: flex; align-items: center; gap: 14px; padding: 12px 14px; margin-bottom: 14px;
    background: #fff8dc; border: 2px solid #3a2a10; border-radius: 14px;
    color: inherit; text-decoration: none;
  }
  a.card:active { transform: scale(.98); }
  a.card img { width: 64px; height: 64px; border-radius: 12px; }
  .t { font-size: 18px; font-weight: bold; }
  .d { font-size: 13px; opacity: .75; margin-top: 2px; }
</style>
</head>
<body>
<main>
  <h1>はなりきしゲームズ</h1>
  <a class="card" href="suika/">
    <img src="parts/icon-192.png" alt="">
    <div><div class="t">はなりきし出世</div><div class="d">同じ力士をぶつけて横綱を目指すパズル</div></div>
  </a>
  <a class="card" href="flappy/">
    <img src="parts/icon-192.png" alt="">
    <div><div class="t">はなりきしフラッピー</div><div class="d">米俵をよけて番付を上げるアクション</div></div>
  </a>
  <a class="card" href="crossy/">
    <img src="parts/icon-192.png" alt="">
    <div><div class="t">はなりきしクロッシー</div><div class="d">斜め俯瞰の立体で、車・川・電車をわたるアクション</div></div>
  </a>
  <a class="card" href="stack/">
    <img src="parts/icon-192.png" alt="">
    <div><div class="t">はなりきしスタック</div><div class="d">力士を乗せたブロックをぴったり積み上げる</div></div>
  </a>
</main>
</body>
</html>
