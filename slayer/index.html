<!doctype html>
<html lang="ja">
<head>

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: #0e1220; display: flex; justify-content: center; align-items: center;
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; color: #f3ecd8;
    -webkit-user-select: none; user-select: none;
  }
  /* 画面は 420×700 の縦長。上が ゲーム、下が 操作の欄 */
  #wrap {
    position: relative; width: min(100vw, calc(100dvh * 420 / 700)); aspect-ratio: 420 / 700;
    container-type: inline-size; background: #1b2238; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,.5);
    display: flex; flex-direction: column;
  }
  #game { display: block; width: 100%; aspect-ratio: 420 / 380; touch-action: none; cursor: pointer; flex: none; }
  #boost {
    position: absolute; left: 2.4cqw; top: calc(100cqw * 380 / 420 - 15cqw); width: 21cqw; height: 12.5cqw; border-radius: 3cqw;
    border: .6cqw solid #3a2a10; background: linear-gradient(#ffd24a, #ff9a2a); color: #3a2a10; font: inherit; font-weight: bold;
    font-size: 3.4cqw; overflow: hidden; cursor: pointer; touch-action: manipulation;
  }
  #boost[disabled] { filter: grayscale(.6) brightness(.8); }
  #boost i { position: absolute; left: 0; bottom: 0; height: 1.2cqw; background: #fff; opacity: .8; }
  #ui { flex: 1; display: flex; flex-direction: column; min-height: 0; font-size: 3.3cqw; }
  #tabs { display: flex; flex: none; background: #11162a; border-top: .5cqw solid #3a4670; border-bottom: .5cqw solid #3a4670; }
  #tabs button {
    flex: 1; padding: 2.2cqw 0; font: inherit; font-weight: bold; color: #aab3d6; background: transparent; border: 0; border-right: .3cqw solid #2a3358; cursor: pointer; position: relative;
  }
  #tabs button.on { color: #fff; background: #26305a; }
  #tabs button .dot { position: absolute; right: 2cqw; top: 1.2cqw; width: 2.2cqw; height: 2.2cqw; border-radius: 50%; background: #ff5a4a; display: none; }
  #tabs button .dot.show { display: block; }
  #panel { flex: 1; overflow-y: auto; padding: 2cqw 2.4cqw 4cqw; background: #1b2238; -webkit-overflow-scrolling: touch; }
  .bulk { display: flex; gap: 1.6cqw; margin-bottom: 2cqw; }
  .bulk button { flex: 1; padding: 1.6cqw 0; border-radius: 2cqw; border: .4cqw solid #3a4670; background: #222b4c; color: #cfd6f2; font: inherit; font-weight: bold; cursor: pointer; }
  .bulk button.on { background: #ffd24a; color: #3a2a10; border-color: #3a2a10; }
  .row { display: flex; align-items: center; gap: 2.4cqw; padding: 2cqw; margin-bottom: 1.6cqw; background: #232c50; border: .4cqw solid #34406e; border-radius: 2.4cqw; }
  .row.lock { opacity: .55; }
  .row .ic { flex: none; width: 10.5cqw; height: 10.5cqw; display: grid; place-items: center; font-size: 6cqw; font-weight: bold; border-radius: 2cqw; background: #10142a; border: .5cqw solid #d4af37; color: #ffd24a; }
  .row .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .6cqw; }
  .row .mid b { font-size: 3.7cqw; }
  .row .mid small { color: #ffd24a; font-weight: bold; margin-left: 1.2cqw; font-size: 3.1cqw; }
  .row .mid span { color: #aab3d6; font-size: 2.9cqw; line-height: 1.35; }
  .row .mid em { color: #8fe08f; font-style: normal; }
  .buy { flex: none; min-width: 22cqw; padding: 2cqw 1.6cqw; border-radius: 2cqw; border: .5cqw solid #3a2a10; background: linear-gradient(#ffe27a, #f0b020); color: #3a2a10; font: inherit; font-weight: bold; cursor: pointer; line-height: 1.25; }
  .buy small { display: block; font-size: 2.7cqw; font-weight: normal; margin: 0; color: #5a4210; }
  .buy[disabled] { background: #3a4260; color: #8a93b8; border-color: #2a3050; cursor: default; }
  .buy[disabled] small { color: #7a83a8; }
  .buy.sp { background: linear-gradient(#b9a2ff, #7a5ad8); color: #fff; border-color: #2a1a60; }
  .buy.sp small { color: #e6dcff; }
  .buy.sp[disabled] { background: #3a4260; color: #8a93b8; border-color: #2a3050; }
  .head { display: flex; justify-content: space-between; align-items: center; margin: 1cqw 0 2cqw; font-weight: bold; }
  .head .sp { color: #cbb8ff; font-size: 4cqw; }
  .big { width: 100%; padding: 3cqw; border-radius: 2.6cqw; border: .6cqw solid #3a2a10; background: linear-gradient(#ffe27a, #f0a020); color: #3a2a10; font: inherit; font-weight: bold; font-size: 4cqw; cursor: pointer; margin: 1cqw 0 2.4cqw; }
  .big[disabled] { background: #3a4260; color: #8a93b8; border-color: #2a3050; }
  .tag { display: inline-block; background: #ff5a4a; color: #fff; font-size: 2.6cqw; padding: .2cqw 1.4cqw; border-radius: 99cqw; margin-left: 1.4cqw; font-weight: bold; }
  .note { color: #8f99c0; font-size: 2.9cqw; line-height: 1.5; margin: 1cqw 0 2cqw; }
  .sec { color: #ffd24a; font-weight: bold; margin: 3cqw 0 1.4cqw; font-size: 3.4cqw; }
  .set { display: flex; gap: 2cqw; flex-wrap: wrap; }
  .set button, .set a { flex: 1 1 40%; padding: 3cqw 2cqw; border-radius: 2.4cqw; border: .4cqw solid #3a4670; background: #222b4c; color: #e8ecff; font: inherit; font-weight: bold; text-align: center; text-decoration: none; cursor: pointer; }
  #toast {
    position: absolute; left: 50%; top: 14cqw; transform: translateX(-50%); padding: 1.6cqw 4cqw; border-radius: 99cqw; background: rgba(10,14,30,.85);
    border: .5cqw solid #ffd24a; font-weight: bold; font-size: 3.6cqw; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .25s;
  }
  #toast.on { opacity: 1; }
  #modal { position: absolute; inset: 0; background: rgba(5,8,20,.72); display: none; align-items: center; justify-content: center; z-index: 5; padding: 6cqw; }
  #modal.on { display: flex; }
  #modal .box { width: 100%; background: #232c50; border: .7cqw solid #d4af37; border-radius: 3cqw; padding: 5cqw; text-align: center; font-size: 3.6cqw; line-height: 1.6; }
  #modal h2 { margin: 0 0 2cqw; font-size: 5cqw; color: #ffd24a; }
  #modal .btns { display: flex; gap: 3cqw; margin-top: 4cqw; }
  #modal .btns button { flex: 1; padding: 2.6cqw; border-radius: 2.4cqw; border: .5cqw solid #3a2a10; background: linear-gradient(#ffe27a, #f0a020); color: #3a2a10; font: inherit; font-weight: bold; cursor: pointer; }
  #modal .btns button.sub { background: #3a4260; color: #cfd6f2; border-color: #2a3050; }
</style>

<div id="wrap">
  <canvas id="game" width="840" height="760"></canvas>

  <div id="ui">
    <div id="tabs">
      <button data-tab="equip" class="on">装備</button>
      <button data-tab="upg">強化<span class="dot" id="dotUpg"></span></button>
      <button data-tab="asc">昇進<span class="dot" id="dotAsc"></span></button>
      <button data-tab="world">世界</button>
      <button data-tab="set">設定</button>

</div>

<script src="../share.js"></script>
<script>
(() => {
  'use strict';
  const W = 420, GH = 380, GROUND = 300;
  const SAVE_KEY = 'sumo-slayer-save', BEST_KEY = 'sumo-slayer-best';
  const $ = id => document.getElementById(id);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];

  // ---- 数の表示（K M B T …）----
  const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
  function fmt(n) {
    if (!isFinite(n)) return '∞';
    if (n < 1000) return n < 10 ? String(Math.round(n * 10) / 10) : String(Math.floor(n));
    const e = Math.floor(Math.log10(n) / 3);
    if (e >= SUF.length) return n.toExponential(2).replace('e+', 'e');
    const v = n / Math.pow(1000, e);
    return v.toFixed(v < 10 ? 2 : v < 100 ? 1 : 0) + SUF[e];
  }

  // ---- 番付（昇進した回数で上がる）----
  const RANKS = [
    { name: '前相撲', body: '#f1efe8', belt: '#111111' }, { name: '序の口', body: '#f7e3bd', belt: '#111111' },
    { name: '序二段', body: '#bfe4f6', belt: '#111111' }, { name: '三段目', body: '#c9eaa5', belt: '#111111' },
    { name: '幕下', body: '#f8cfe0', belt: '#111111' }, { name: '十両', body: '#ffd699', belt: '#e65100' },
    { name: '前頭', body: '#dcc4f2', belt: '#6a1b9a' }, { name: '小結', body: '#ffb3a1', belt: '#b71c1c' },
    { name: '関脇', body: '#b9e3d3', belt: '#7a4a00' }, { name: '大関', body: '#ff9a3c', belt: '#14507a' },
    { name: '横綱', body: '#ffee00', belt: '#1f5c00' },
  ];
  const rankOf = n => Math.min(RANKS.length - 1, n);

  // ---- 装備（コインで育てる。CpS＝毎秒のコイン）----
  const SLOTS = [
    { id: 'harite', name: '張り手', icon: '張', base: 1, cost: 15, unlock: 0, desc: '敵を倒す力も上がる' },
    { id: 'gunbai', name: '軍配', icon: '軍', base: 8, cost: 120, unlock: 8 },
    { id: 'hachimaki', name: '鉢巻', icon: '巻', base: 60, cost: 1000, unlock: 80 },
    { id: 'keshou', name: '化粧まわし', icon: '帯', base: 450, cost: 9000, unlock: 800 },
    { id: 'tabi', name: '足袋', icon: '足', base: 3500, cost: 80000, unlock: 8000 },
  ];
  const GROW = 1.12;
  const mile = lv => Math.pow(2, Math.min(8, Math.floor(lv / 25)));   // 25レベルごとに2倍

  // ---- 強化（コインで買う。昇進でなくなる）----
  const UPGRADES = [];
  SLOTS.forEach((s, i) => [10, 25, 50, 100, 150, 200].forEach((L, k) => UPGRADES.push({
    id: `s${i}_${L}`, name: `${s.name}の鍛錬 ${k + 1}`, desc: `${s.name}のCpSが2倍`, slot: i, lv: L, mul: 2,
    cost: s.cost * Math.pow(GROW, L) * 9, req: st => st.eq[i] >= L,
  })));
  [['ちゃんこ', 500], ['焼き魚', 2e4], ['お赤飯', 1e6], ['鯛のお頭', 5e7], ['大鍋', 3e9], ['祝い酒', 2e11], ['宴の席', 1e13], ['千秋楽の膳', 8e14]].forEach(([n, c], k) => UPGRADES.push({
    id: `g${k}`, name: n, desc: '全体のCpSが1.5倍', all: 1.5, cost: c, req: st => st.totalCps >= c / 400,
  }));
  [['金の塩', 3e3], ['福の小判', 4e5], ['招き土俵', 6e7], ['打ち出の小槌', 9e9]].forEach(([n, c], k) => UPGRADES.push({
    id: `c${k}`, name: n, desc: 'コイン1枚の価値 +5%', coin: 0.05, cost: c, req: st => st.totalCps >= c / 300,
  }));

  // ---- 昇進（スレイヤーポイントで買う。ずっと残る）----
  const NODES = [
    { id: 'soulGather', name: 'ソウルあつめ', cost: 2, desc: 'ソウルが +25%', fx: { soul: 0.25 } },
    { id: 'reinvest', name: '再投資', cost: 8, desc: 'コイン1枚が CpS の25% になる', fx: { coin: 0.15 } },
    { id: 'reaper', name: 'ソウルリーパー', cost: 5, desc: '持っているSP1点ごとに ソウル +1%', fx: { reaper: 0.01 } },
    { id: 'idle', name: '真・放置力士', cost: 5, desc: '閉じている間の稼ぎ +50%', fx: { offline: 0.5 } },
    { id: 'dj', name: '二段ジャンプ', cost: 15, desc: '空中でもう一度ジャンプできる', fx: { dj: 1 } },
    { id: 'launder', name: 'マネーロンダリング', cost: 25, req: 'reinvest', desc: 'コイン1枚の価値が さらに +30%', fx: { coin: 0.3 } },
    { id: 'ore1', name: '青い鉱石', cost: 10, desc: 'CpS +10%', fx: { cpsMul: 0.1 } },
    { id: 'boostUp', name: 'ブースト強化', cost: 10, desc: 'ブーストが長く、すぐ回復する', fx: { boost: 1 } },
    { id: 'magnet', name: '招き猫の磁石', cost: 12, desc: 'コインを遠くから吸いよせる', fx: { magnet: 1 } },
    { id: 'box', name: 'ランダム箱 増量', cost: 14, desc: '箱が出る回数が増える', fx: { box: 1 } },
    { id: 'portal', name: 'ポータル', cost: 20, desc: '別の世界へ行ける（世界の欄）', fx: { portal: 1 } },
    { id: 'ore2', name: '赤い鉱石', cost: 20, req: 'ore1', desc: 'CpS +10%', fx: { cpsMul: 0.1 } },
    { id: 'stocks', name: '株買い', cost: 50, req: 'launder', desc: 'コイン1枚の価値が さらに +45%', fx: { coin: 0.45 } },
    { id: 'soul2', name: 'ソウルの器', cost: 30, req: 'soulGather', desc: 'ソウルが +50%', fx: { soul: 0.5 } },
    { id: 'dim1', name: '世界：夜の稽古場', cost: 12, req: 'portal', desc: 'ポータルで行ける世界が ふえる（ソウル ×1.3）', fx: { dim: 1 } },
    { id: 'dim2', name: '世界：縁日の夜', cost: 30, req: 'dim1', desc: 'ソウル ×1.7', fx: { dim: 2 } },
    { id: 'dim3', name: '世界：雪の巡業', cost: 60, req: 'dim2', desc: 'ソウル ×2.2', fx: { dim: 3 } },
    { id: 'ore3', name: '緑の鉱石', cost: 40, req: 'ore2', desc: 'CpS +10%', fx: { cpsMul: 0.1 } },
    { id: 'start', name: 'ヘッドスタート', cost: 35, desc: '昇進のあと、少しのコインから始まる', fx: { start: 1 } },
  ];
  const NODE_BY = Object.fromEntries(NODES.map(n => [n.id, n]));

  // ---- 世界 ----
  const DIMS = [
    { name: '土俵ひろば', sky: ['#7fc8ff', '#d9f1ff'], far: '#a7d3a8', near: '#78bb78', ground: '#c9a56a', grass: '#5aa65a', soul: 1,
      mon: { small: 'タワラスライム', air: 'カラス', giant: 'あばれ牛' }, col: ['#e0b860', '#3a3a52', '#a86a3a'] },
    { name: '夜の稽古場', sky: ['#1b1a3a', '#4a3f86'], far: '#4a4478', near: '#3a3466', ground: '#6a5a4a', grass: '#4a4a7a', soul: 1.3,
      mon: { small: 'ちょうちんおばけ', air: 'こうもり', giant: '大入道' }, col: ['#e8eeff', '#5a3a7a', '#7a6a9a'] },
    { name: '縁日の夜', sky: ['#2a1030', '#b04a70'], far: '#8a3a64', near: '#6a2a50', ground: '#7a5a3a', grass: '#c0507a', soul: 1.7,
      mon: { small: 'たこやきん', air: 'ふうせん', giant: '金魚鉢の大関' }, col: ['#ffb066', '#ff6a8a', '#e0a040'] },
    { name: '雪の巡業', sky: ['#bfe0ff', '#f4fbff'], far: '#dbe9f6', near: '#c4d8ee', ground: '#eef4fa', grass: '#ffffff', soul: 2.2,
      mon: { small: 'ゆきだるま', air: 'こおりの鳥', giant: '氷の横綱' }, col: ['#ffffff', '#7ac8f0', '#a8d8f8'] },
  ];

  // ---- 状態 ----
  const fresh = () => ({
    coins: 0, eq: [0, 0, 0, 0, 0], upg: {}, nodes: {}, sp: 0, spRun: 0, spAll: 0, asc: 0, gauge: 0,
    dim: 0, portalAt: 0, bulk: 1, kills: 0, jumps: 0, boxes: 0, playSec: 0, last: Date.now(), sound: true, totalCps: 0,
  });
  let S = fresh();
  function load() {
    try { const o = JSON.parse(localStorage.getItem(SAVE_KEY)); if (o && o.eq) S = { ...fresh(), ...o }; } catch {}
  }
  function save() { S.last = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); localStorage.setItem(BEST_KEY, String(S.asc)); } catch {} }

  // ---- 強さの計算 ----
  let P = {};   // 昇進の効果をまとめたもの
  function calcPerks() {
    P = { soul: 1, coin: 0.10, offline: 0.5, dj: 0, cpsMul: 1, boost: 0, magnet: 0, box: 0, portal: 0, dim: 0, start: 0, reaper: 0 };
    let soulAdd = 0, cpsAdd = 0;
    for (const n of NODES) if (S.nodes[n.id]) {
      const f = n.fx;
      if (f.soul) soulAdd += f.soul; if (f.cpsMul) cpsAdd += f.cpsMul; if (f.coin) P.coin += f.coin;
      if (f.offline) P.offline += f.offline; if (f.reaper) P.reaper += f.reaper;
      for (const k of ['dj', 'boost', 'magnet', 'box', 'portal', 'start']) if (f[k]) P[k] = 1;
      if (f.dim) P.dim = Math.max(P.dim, f.dim);
    }
    P.soul = 1 + soulAdd; P.cpsMul = 1 + cpsAdd;
  }
  let slotMul = [1, 1, 1, 1, 1], allMul = 1, coinAdd = 0;
  function calcMults() {
    slotMul = [1, 1, 1, 1, 1]; allMul = 1; coinAdd = 0;
    for (const u of UPGRADES) if (S.upg[u.id]) {
      if (u.slot !== undefined) slotMul[u.slot] *= u.mul; if (u.all) allMul *= u.all; if (u.coin) coinAdd += u.coin;
    }
  }
  const slotCps = i => SLOTS[i].base * S.eq[i] * mile(S.eq[i]) * slotMul[i];
  let fxFrenzy = 0, fxMega = 0;     // 箱のイベントで ふえる
  function baseCps() { let c = 0; for (let i = 0; i < 5; i++) c += slotCps(i); return c * allMul * P.cpsMul; }
  const cps = () => baseCps() * (fxMega > 0 ? 5 : 1);
  const coinPct = () => P.coin + coinAdd;
  const coinValue = () => Math.max(1, baseCps() * coinPct()) * (fxFrenzy > 0 ? 2 : 1) * (fxMega > 0 ? 5 : 1);
  const soulCap = () => 150 * Math.pow(1.045, S.spRun);
  const soulMul = () => P.soul * (1 + P.reaper * S.sp) * DIMS[S.dim].soul * (1 + 0.1 * S.asc) * (fxFrenzy > 0 ? 2 : 1);
  const dps = () => 40 + S.eq[0] * 6 * mile(S.eq[0]);
  const eqCost = (i, n) => SLOTS[i].cost * Math.pow(GROW, S.eq[i]) * (Math.pow(GROW, n) - 1) / (GROW - 1);
  function maxBuy(i) { let n = 0; while (n < 400 && eqCost(i, n + 1) <= S.coins) n++; return n; }
  const slotOpen = i => i === 0 || S.eq[i] > 0 || S.totalCps >= SLOTS[i].unlock;

  // ---- 画像 ----
  const SRC = ['body_color', 'mawashi', 'body_line', 'normal', 'collision', 'win'];
  const IMG = {};
  const CX = 513, CY = 538, BODY_R = 395;
  const loadImages = () => Promise.all(SRC.map(n => new Promise((res, rej) => {
    const i = new Image(); i.onload = () => { IMG[n] = i; res(); }; i.onerror = () => rej(new Error('画像を読み込めません: ' + n)); i.src = `../parts/${n}.png`;
  })));
  const tint = (img, color) => {
    const c = document.createElement('canvas'); c.width = c.height = 1024;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0);
    g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, 1024, 1024); return c;
  };
  const R = 21, DPR = 2, sprites = [];
  function buildSprites() {
    const size = Math.ceil(1024 * R / BODY_R * DPR);
    RANKS.forEach(rk => {
      const bodyT = tint(IMG.body_color, rk.body), beltT = tint(IMG.mawashi, rk.belt), faces = {};
      for (const face of ['normal', 'hit', 'win']) {
        const c = document.createElement('canvas'); c.width = c.height = size;
        const g = c.getContext('2d'); g.imageSmoothingQuality = 'high';

  // ---- 音 ----
  let AC = null;

  // ---- ゲームの中 ----

  function puff(x, y, c, n = 6) { for (let i = 0; i < n; i++) fx.push({ x, y, vx: rnd(-60, 60), vy: rnd(-90, -10), t: rnd(0.25, 0.5), c }); }

    else if (r < 0.58) { say('大群が おそってくる！', '#ff8a7a'); for (let i = 0; i < 14; i++) spawnEnemy('air', W + 40 + i * 34, GROUND - rnd(70, 140)); }

  }

  function step(dt) {
    t += dt; S.playSec += dt;
    fxFrenzy = Math.max(0, fxFrenzy - dt); fxMega = Math.max(0, fxMega - dt);
    boostT = Math.max(0, boostT - dt); if (boostT <= 0) boostCd = Math.max(0, boostCd - dt);
    hitT = Math.max(0, hitT - dt); winT = Math.max(0, winT - dt); shake = Math.max(0, shake - dt); gaugeFlash = Math.max(0, gaugeFlash - dt);
    // 自動でコインが入る（CpS）
    S.coins += cps() * dt;

    // 自分
    if (holdT > 0 && holding && pl.vy < 0) { holdT -= dt; pl.vy += 1900 * 0.5 * dt; } else { holdT = 0; pl.vy += 1900 * dt; }
    pl.y += pl.vy * dt;
    if (pl.y >= GROUND) { pl.y = GROUND; pl.vy = 0; pl.ground = true; pl.jumps = 0; }
    const pr = { x: pl.x - 14, y: pl.y - 2 * R + 4, w: 28, h: 2 * R - 4 };

    // 世界の流れ
    const sp = baseSpeed() * (boostT > 0 ? 1.8 : 1) * (giantHold ? 0.3 : 1);   // 巨人をつかまえている間は ゆっくり
    giantHold = 0;
    scroll += sp * dt;

    // 敵
    spawnT -= dt;
    if (spawnT <= 0) {
      const r = Math.random(), kind = r < 0.5 ? 'small' : r < 0.82 ? 'air' : 'giant';
      spawnEnemy(kind); spawnT = rnd(0.7, 1.7) / (1 + 0.1 * S.dim);
    }
    for (const e of enemies) {
      e.x -= sp * dt * (e.kind === 'air' ? 1.15 : 1);
      if (e.air) e.y += Math.sin(t * 4 + e.ph) * 24 * dt;
      const er = { x: e.x - e.w / 2, y: e.y - e.h, w: e.w, h: e.h };
      if (!e.dead && pr.x < er.x + er.w && pr.x + pr.w > er.x && pr.y < er.y + er.h && pr.y + pr.h > er.y) {
        e.hp -= dps() * dt * (boostT > 0 ? 1.3 : 1); e.hurt = 0.1; hitT = Math.max(hitT, 0.12);
        if (e.kind === 'giant') giantHold = 1;

      e.hurt = Math.max(0, (e.hurt || 0) - dt);
    }
    enemies = enemies.filter(e => !e.dead && e.x > -60);

    // コイン

    const mag = P.magnet ? 80 : 0;

      if (c.fall) { c.y += 140 * dt; c.x -= sp * dt * 0.4; if (c.y > GROUND - 8) { c.y = GROUND - 8; c.fall = 0; } } else c.x -= sp * dt;
      const dx = pl.x - c.x, dy = pl.y - R - c.y, d = Math.hypot(dx, dy);

    }

    for (const p of pops) { p.t -= dt; p.y -= 26 * dt; }
    pops = pops.filter(p => p.t > 0);

  }

  // ---- 描画 ----
  function drawBg(g) {

  function face(g, x, y, r, angry, big) {

  // ---- 操作 ----

  window.addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp') holding = false; });
  const boostBtn = $('boost');

  boostBtn.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); doBoost(); });

  // ---- 下の操作の欄 ----
  let tab = 'equip', sig = '';
  function toast(s) { const el = $('toast'); el.textContent = s; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 1800); }
  function modal(html, btns) {
    $('modalBox').innerHTML = html + `<div class="btns">${btns.map((b, i) => `<button class="${b.sub ? 'sub' : ''}" data-m="${i}">${b.t}</button>`).join('')}</div>`;
    $('modal').classList.add('on');
    $('modalBox').onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; $('modal').classList.remove('on'); const f = btns[+b.dataset.m].f; if (f) f(); };
  }
  const nodeOk = n => !n.req || S.nodes[n.req];
  const availUpg = () => UPGRADES.filter(u => !S.upg[u.id] && u.req(S)).sort((a, b) => a.cost - b.cost);

  function panelHtml() {
    if (tab === 'equip') {
      let h = `<div class="bulk">${[1, 10, 50, 0].map(n => `<button data-bulk="${n}" class="${S.bulk === n ? 'on' : ''}">${n ? '×' + n : 'MAX'}</button>`).join('')}</div>`;
      SLOTS.forEach((s, i) => {
        if (!slotOpen(i)) { h += `<div class="row lock"><div class="ic">？</div><div class="mid"><b>？？？</b><span>CpS ${fmt(s.unlock)} で解放</span></div></div>`; return; }
        const n = S.bulk || Math.max(1, maxBuy(i)), cost = eqCost(i, n), can = S.coins >= cost;
        const after = SLOTS[i].base * (S.eq[i] + n) * mile(S.eq[i] + n) * slotMul[i] * allMul * P.cpsMul;
        const nowc = slotCps(i) * allMul * P.cpsMul;
        const next = 25 - (S.eq[i] % 25);
        h += `<div class="row"><div class="ic">${s.icon}</div><div class="mid"><b>${s.name}<small>Lv ${S.eq[i]}</small></b><span>CpS ${fmt(nowc)} → <em>${fmt(after)}</em><br>次の2倍まで あと${next}レベル${s.desc ? '・' + s.desc : ''}</span></div>
          <button class="buy" data-eq="${i}" ${can ? '' : 'disabled'}>強化 ×${n}<small>${fmt(cost)}</small></button></div>`;
      });
      return h;
    }
    if (tab === 'upg') {
      const l = availUpg().slice(0, 14);
      if (!l.length) return '<div class="note">いま買える強化はありません。装備を育てると増えます。</div>';
      return `<div class="note">強化は 昇進するとリセットされます。</div>` + l.map(u => `<div class="row"><div class="ic">強</div><div class="mid"><b>${u.name}</b><span>${u.desc}</span></div>
        <button class="buy" data-upg="${u.id}" ${S.coins >= u.cost ? '' : 'disabled'}>買う<small>${fmt(u.cost)}</small></button></div>`).join('');
    }
    if (tab === 'asc') {
      const rec = S.spRun >= 8 + 4 * S.asc;
      let h = `<div class="head"><span>昇進（${RANKS[rankOf(S.asc)].name} → ${RANKS[rankOf(S.asc + 1)].name}）${rec ? '<span class="tag">おすすめ</span>' : ''}</span><span class="sp">SP ${fmt(S.sp)}</span></div>
        <button class="big" data-ascend="1">昇進する</button>
        <div class="note">昇進すると コイン・装備・強化が ゼロに戻ります。SP と 買った昇進スキルは ずっと残ります。今回の稼ぎ: SP ${fmt(S.spRun)}。</div><div class="sec">昇進スキル</div>`;
      for (const n of NODES) {
        const own = S.nodes[n.id], ok = nodeOk(n);
        h += `<div class="row ${ok || own ? '' : 'lock'}"><div class="ic" style="color:#cbb8ff;border-color:#8a6ad8">${own ? '✔' : '昇'}</div><div class="mid"><b>${n.name}</b><span>${n.desc}${n.req && !ok ? `<br>先に「${NODE_BY[n.req].name}」` : ''}</span></div>
          ${own ? '<span style="color:#8fe08f;font-weight:bold">取得済み</span>' : `<button class="buy sp" data-node="${n.id}" ${ok && S.sp >= n.cost ? '' : 'disabled'}>取る<small>SP ${n.cost}</small></button>`}</div>`;
      }
      return h;
    }
    if (tab === 'world') {
      const cd = Math.max(0, Math.ceil((S.portalAt - Date.now()) / 1000));
      let h = P.portal ? '' : '<div class="note">昇進スキル「ポータル」を取ると、別の世界へ行けます。</div>';
      DIMS.forEach((d, i) => {
        const open = i === 0 || (P.portal && P.dim >= i);
        h += `<div class="row ${open ? '' : 'lock'}"><div class="ic" style="background:${d.sky[0]};color:#fff">${i + 1}</div><div class="mid"><b>${d.name}${S.dim === i ? '<small>いまここ</small>' : ''}</b><span>ソウル ×${d.soul}　敵: ${d.mon.small}・${d.mon.air}・${d.mon.giant}</span></div>
          ${open && S.dim !== i ? `<button class="buy" data-dim="${i}" ${cd > 0 ? 'disabled' : ''}>行く<small>${cd > 0 ? 'あと' + cd + '秒' : 'ポータル'}</small></button>` : ''}</div>`;
      });
      return h;
    }
    return `<div class="sec">データ</div><div class="note">番付 ${RANKS[rankOf(S.asc)].name}（昇進 ${S.asc}回）／ 倒した敵 ${fmt(S.kills)} ／ ジャンプ ${fmt(S.jumps)} ／ 箱 ${fmt(S.boxes)} ／ 遊んだ時間 ${Math.floor(S.playSec / 60)}分</div>
      <div class="set"><button data-set="sound">音：${S.sound ? 'ON' : 'OFF'}</button><button data-set="share">Xでシェア</button><a href="../">◀ ゲーム一覧</a><button data-set="reset">データを消す</button></div>
      <div class="note" style="margin-top:3cqw">放置のしかた: 画面を開いたままでも、閉じていても、CpS ぶんの コインと ソウルが たまります（最大8時間）。</div>`;
  }
  function panelSig() {
    const aff = (v) => S.coins >= v ? 1 : 0;
    if (tab === 'equip') return 'e' + S.bulk + S.eq.join() + SLOTS.map((s, i) => aff(eqCost(i, S.bulk || 1)) + (slotOpen(i) ? 'o' : 'x')).join('') + Math.floor(S.totalCps);
    if (tab === 'upg') return 'u' + availUpg().slice(0, 14).map(u => u.id + aff(u.cost)).join();
    if (tab === 'asc') return 'a' + S.sp + Object.keys(S.nodes).join() + (S.spRun >= 8 + 4 * S.asc);
    if (tab === 'world') return 'w' + S.dim + Math.ceil((S.portalAt - Date.now()) / 1000) + P.portal + P.dim;
    return 's' + S.sound + Math.floor(S.playSec / 60);
  }
  function refreshPanel(force) {
    const s = panelSig();
    if (!force && s === sig) return;
    sig = s; const p = $('panel'), top = p.scrollTop;
    p.innerHTML = panelHtml(); p.scrollTop = top;
    $('dotUpg').classList.toggle('show', availUpg().some(u => S.coins >= u.cost));
    $('dotAsc').classList.toggle('show', S.spRun >= 8 + 4 * S.asc || Object.values(NODES).some(n => !S.nodes[n.id] && nodeOk(n) && S.sp >= n.cost));
  }
  $('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; tab = b.dataset.tab; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b)); refreshPanel(true); $('panel').scrollTop = 0; });
  $('panel').addEventListener('click', e => {
    const q = a => e.target.closest(`[${a}]`);
    let b;
    if ((b = q('data-bulk'))) { S.bulk = +b.dataset.bulk; refreshPanel(true); return; }
    if ((b = q('data-eq'))) { const i = +b.dataset.eq, n = S.bulk || Math.max(1, maxBuy(i)), c = eqCost(i, n); if (S.coins >= c) { S.coins -= c; S.eq[i] += n; beep(500, 0.08, 'triangle', 0.05, 300); recompute(); refreshPanel(true); } return; }
    if ((b = q('data-upg'))) { const u = UPGRADES.find(x => x.id === b.dataset.upg); if (u && S.coins >= u.cost && !S.upg[u.id]) { S.coins -= u.cost; S.upg[u.id] = 1; beep(620, 0.1, 'triangle', 0.05, 300); recompute(); refreshPanel(true); } return; }
    if ((b = q('data-node'))) { const n = NODE_BY[b.dataset.node]; if (n && S.sp >= n.cost && !S.nodes[n.id] && nodeOk(n)) { S.sp -= n.cost; S.nodes[n.id] = 1; beep(760, 0.15, 'triangle', 0.05, 400); recompute(); refreshPanel(true); toast(n.name + ' を取得！'); save(); } return; }
    if ((b = q('data-ascend'))) { ascendAsk(); return; }
    if ((b = q('data-dim'))) { goDim(+b.dataset.dim); return; }
    if ((b = q('data-set'))) {
      const k = b.dataset.set;
      if (k === 'sound') { S.sound = !S.sound; refreshPanel(true); }
      if (k === 'share') HanaShare.open(`はなりきしスレイヤーで ${RANKS[rankOf(S.asc)].name}（昇進${S.asc}回）、CpS ${fmt(cps())}！`);
      if (k === 'reset') modal('<h2>データを消す</h2>ぜんぶ消えます。本当に消しますか？', [{ t: 'やめる', sub: 1 }, { t: '消す', f: () => { try { localStorage.removeItem(SAVE_KEY); } catch {} S = fresh(); recompute(); resetWorld(); refreshPanel(true); } }]);
    }
  });
  function recompute() { calcPerks(); calcMults(); S.totalCps = Math.max(S.totalCps, baseCps()); }
  function ascendAsk() {
    const gain = S.spRun;
    modal(`<h2>昇進する</h2>${RANKS[rankOf(S.asc)].name} → <b>${RANKS[rankOf(S.asc + 1)].name}</b><br>コイン・装備・強化は ゼロに戻ります。<br>SP ${fmt(S.sp)} と 昇進スキルは 残ります。${gain < 8 ? '<br><small>（SP が まだ少ないので、もう少し 稼いでからが おすすめ）</small>' : ''}`,
      [{ t: 'やめる', sub: 1 }, { t: '昇進！', f: ascend }]);
  }
  function ascend() {
    S.asc++; S.coins = 0; S.eq = [0, 0, 0, 0, 0]; S.upg = {}; S.spRun = 0; S.gauge = 0; S.totalCps = 0;
    recompute(); if (P.start) S.coins = 500 * Math.pow(3, Math.min(S.asc, 8));
    resetWorld(); winT = 1.5; say('昇進！ ' + RANKS[rankOf(S.asc)].name, '#ffd24a'); beep(523, 0.5, 'triangle', 0.06, 523);
    save(); refreshPanel(true);
  }
  function goDim(i) {
    if (Date.now() < S.portalAt) return;
    S.dim = i; S.portalAt = Date.now() + 90000; enemies = []; say('ポータル！ ' + DIMS[i].name, '#bfe8ff'); beep(300, 0.4, 'sine', 0.06, 600); refreshPanel(true); save();
  }

  // ---- 放置の稼ぎ ----
  function offline(sec) {
    if (sec < 20) return;
    sec = Math.min(sec, 8 * 3600);
    const c = cps() * sec * P.offline;
    const kps = 0.5 * (1 + (S.nodes.idle ? 0.5 : 0)), souls = sec * kps * 3 * soulMul() * 0.4;
    const sp0 = S.sp; S.coins += c; addSouls(souls);
    const m = Math.floor(sec / 60);
    modal(`<h2>おかえりなさい</h2>${m >= 60 ? Math.floor(m / 60) + '時間' : ''}${m % 60}分 るすの間に<br>コイン <b>+${fmt(c)}</b><br>SP <b>+${fmt(S.sp - sp0)}</b>`, [{ t: 'ありがとう' }]);
  }

  // ---- 起動 ----
  let last = 0, saveT = 0, panelT = 0;
  function frame(now) {
    const raw = (now - last) / 1000 || 0; last = now;
    const dt = Math.min(0.05, raw);
    if (!document.hidden) { step(dt); draw(); }
    saveT += dt; if (saveT > 5) { saveT = 0; save(); }
    panelT += dt; if (panelT > 0.25) { panelT = 0; refreshPanel(false); updBoost(); }
    requestAnimationFrame(frame);
  }
  function updBoost() {
    const b = boostBtn, on = boostT > 0, cd = boostCd > 0;
    b.disabled = on || cd; b.firstChild.nodeValue = on ? 'ブースト中' : cd ? `あと${Math.ceil(boostCd)}秒` : 'ブースト';
    b.querySelector('i').style.width = (on ? boostT / boostLen() : cd ? 1 - boostCd / boostWait() : 1) * 100 + '%';
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) save();
    else { const sec = (Date.now() - S.last) / 1000; offline(sec); S.last = Date.now(); }
  });
  window.addEventListener('pagehide', save);

  // 開発用: アドレスの最後に #debug を付けると、中の状態をさわれる（バランス調整に使う）
  if (location.hash === '#debug') window.__dbg = { get S() { return S; }, set S(v) { S = v; recompute(); refreshPanel(true); }, recompute, refreshPanel, step, cps, coinValue, soulMul, soulCap, fresh, save };
  loadImages().then(() => {
    buildSprites(); load(); recompute(); resetWorld();
    const sec = (Date.now() - (S.last || Date.now())) / 1000; S.last = Date.now();
    refreshPanel(true);
    requestAnimationFrame(t0 => { last = t0; frame(t0); });
    offline(sec);
  }).catch(err => { document.body.textContent = err.message; });

  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
