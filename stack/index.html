<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>はなりきしスタック</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="はなりきしゲームズ">
<meta property="og:title" content="はなりきしスタック">
<meta property="og:description" content="力士を乗せたブロックをぴったり積み上げる">
<meta property="og:url" content="https://hanarikishi.github.io/hanarikishi-game/stack/">
<meta property="og:image" content="https://hanarikishi.github.io/hanarikishi-game/thumbs/stack.jpg">
<meta name="twitter:card" content="summary">
<meta name="description" content="力士を乗せたブロックをぴったり積み上げる">
<link rel="icon" href="../parts/icon-192.png">
<link rel="apple-touch-icon" href="../parts/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1d4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: #e9e2d2; display: flex; justify-content: center; align-items: center;
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  canvas {
    display: block; height: min(100dvh, calc(100vw * 700 / 420)); aspect-ratio: 420 / 700;
    box-shadow: 0 0 30px rgba(80, 60, 30, .3); touch-action: none; cursor: pointer;
  }
  /* ゲーム一覧へ戻るボタン（遊んでいないときだけ、画面の左下に出す） */
  #toList {
    position: fixed; z-index: 5; text-decoration: none;
    left: calc(50vw - min(100dvh * 420 / 700, 100vw) / 2 + 10px);
    bottom: calc(50dvh - min(100dvh, 100vw * 700 / 420) / 2 + 10px);
    padding: 6px 14px; border-radius: 999px; border: 2px solid #3a2a10;
    background: rgba(255, 248, 220, .94); color: #3a2a10; font-weight: bold; font-size: 14px;
  }
  #toList[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="game" width="840" height="1400"></canvas>
<a id="toList" href="../">◀ ゲーム一覧</a>

<script src="../back.js"></script>
<script src="../share.js"></script>
<script src="../rank.js"></script>
<script src="../firebase-config.js"></script>
<script>
(() => {
  'use strict';
  const toList = document.getElementById('toList');

  // ================= 定義 =================
  const W = 420, H = 700;

  // 斜め45度の等角投影。ワールドは x（右前）・z（左前）・y（上）
  const KX = 0.5, KY = 0.25;          // 1ワールド単位あたりの画面移動（×SC）
  const SC = 150;                     // 初期ブロックの一辺 = 1.0 のときの画面スケール
  const BH = 0.17;                    // ブロックの高さ（ワールド単位）
  const START = 1.0;                  // 最初のブロックの幅
  const PERFECT = 0.035;              // この誤差以内ならぴったり（本家より少しだけ甘め）
  const SPEED0 = 2.9, SPEED_UP = 0.03, SPEED_MAX = 5.2; // 往復の速さ（ワールド単位/秒）
  const RANGE = 1.3;                  // 動くブロックの振幅
  const LOOK_Y = 0.55 * H;            // 最上段を置く画面の高さ

  const RANKS = [
    { name: '前相撲', from: 0,   body: '#f1efe8', belt: '#111111' },
    { name: '序の口', from: 2,   body: '#f7e3bd', belt: '#111111' },
    { name: '序二段', from: 4,   body: '#bfe4f6', belt: '#111111' },
    { name: '三段目', from: 6,   body: '#c9eaa5', belt: '#111111' },
    { name: '幕下',   from: 9,   body: '#f8cfe0', belt: '#111111' },
    { name: '十両',   from: 13,  body: '#ffd699', belt: '#e65100' },
    { name: '前頭',   from: 18,  body: '#dcc4f2', belt: '#6a1b9a' },
    { name: '小結',   from: 24,  body: '#ffb3a1', belt: '#b71c1c' },
    { name: '関脇',   from: 31,  body: '#b9e3d3', belt: '#7a4a00' },
    { name: '大関',   from: 39,  body: '#ff9a3c', belt: '#14507a' },
    { name: '横綱',   from: 50,  body: '#ffee00', belt: '#1f5c00' },
  ];
  const rankOf = s => { let l = 0; RANKS.forEach((r, i) => { if (s >= r.from) l = i; }); return l; };

  // ================= 画像 =================
  const SRC = ['body_color', 'mawashi', 'body_line', 'normal', 'collision', 'win', 'home'];
  const IMG = {};
  const CX = 513, CY = 538, BODY_R = 395;

  function loadImages() {
    return Promise.all(SRC.map(n => new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => { IMG[n] = i; res(); };
      i.onerror = () => rej(new Error('画像を読み込めません: ' + n));
      i.src = `../parts/${n}.png`;
    })));
  }

  function tint(img, color) {
    const c = document.createElement('canvas');
    c.width = c.height = 1024;
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = color;
    g.fillRect(0, 0, 1024, 1024);
    return c;
  }

  const DPR = 2;
  const PLAYER_R = 22;
  const SCALE = PLAYER_R / BODY_R;
  const sprites = [];
  function buildSprites() {
    const size = Math.ceil(1024 * SCALE * DPR);
    RANKS.forEach(rk => {
      const bodyT = tint(IMG.body_color, rk.body);
      const beltT = tint(IMG.mawashi, rk.belt);
      const faces = {};
      for (const face of ['normal', 'hit', 'win']) {
        const c = document.createElement('canvas');
        c.width = c.height = size;
        const g = c.getContext('2d');
        g.imageSmoothingQuality = 'high';
        const d = im => g.drawImage(im, 0, 0, size, size);
        d(bodyT); d(beltT); d(IMG.body_line);
        d(face === 'normal' ? IMG.normal : face === 'hit' ? IMG.collision : IMG.win);
        faces[face] = c;
      }
      sprites.push(faces);
    });
  }

  // 足元(fx, fy)に立たせて描く。回転 rot は足元を中心に
  function drawSumo(g, lv, face, fx, fy, sx = 1, sy = 1, rot = 0, scale = 1) {
    const cv = sprites[lv][face];
    const w = cv.width / DPR;
    g.save();
    g.translate(fx, fy);
    g.rotate(rot);
    g.scale(sx * scale, sy * scale);
    g.drawImage(cv, -CX * SCALE, -CY * SCALE - PLAYER_R * 0.92, w, w);
    g.restore();
  }

  // ================= 音 =================
  let AC = null, muted = false;
  try { muted = localStorage.getItem('sumo-stack-mute') === '1'; } catch {}
  function ac() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(f0, f1, dur, type = 'sine', vol = 0.08, delay = 0) {
    if (muted) return;
    const a = ac(); if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), gn = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    gn.gain.setValueAtTime(vol, t);
    gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(gn); gn.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const NOTES = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5]; // ペンタトニック風
  const sfx = {
    place()   { tone(220, 160, 0.12, 'triangle', 0.1); },
    perfect(n) { const f = NOTES[Math.min(n - 1, NOTES.length - 1)]; tone(f, f, 0.25, 'sine', 0.09); tone(f * 2, f * 2, 0.3, 'sine', 0.04, 0.03); },
    fall()    { tone(500, 70, 0.7, 'sawtooth', 0.06); },
    rank()    { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.14, 'square', 0.05, i * 0.08)); },
  };

  // ================= 状態 =================
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  ctx.scale(cv.width / W, cv.height / H);

  // 1つのブロック: 中心(cx, cz), 幅(sx, sz), 高さ段 level, 色相 hue
  let tower, cur, falling, sumoFall, particles, rings, stars;
  let state, score, best, perfectChain, camY, camTarget, winT, deadT, axisX, dirSign, t0, bgHue, combo, flashT;
  let sumoLv;
  try { best = +localStorage.getItem('sumo-stack-best') || 0; } catch { best = 0; }

  const rnd = (a, b) => a + Math.random() * (b - a);

  function hueOf(level) { return (level * 7 + 45) % 360; }
  function colorOf(level, l, a = 1) { return `hsla(${hueOf(level)},${78}%,${l}%,${a})`; }

  function newBlock(level) {
    const top = tower[tower.length - 1];
    axisX = level % 2 === 0;             // x方向 / z方向を交互に
    dirSign = Math.random() < 0.5 ? -1 : 1;
    const b = { cx: top.cx, cz: top.cz, sx: top.sx, sz: top.sz, level, hue: hueOf(level) };
    b.baseX = top.cx; b.baseZ = top.cz;
    b.phase = -Math.PI / 2;                // 端から動き出す
    const off = RANGE * dirSign;
    if (axisX) b.cx = top.cx + off; else b.cz = top.cz + off;
    return b;
  }

  function reset() {
    tower = [{ cx: 0, cz: 0, sx: START, sz: START, level: 0, hue: hueOf(0) }];
    cur = null; falling = []; particles = []; rings = []; sumoFall = null;
    state = 'ready'; score = 0; perfectChain = 0; combo = 0;
    camY = 0; camTarget = 0; winT = 0; deadT = 0; flashT = 0; t0 = 0;
    sumoLv = 0;
    cur = newBlock(1);
    stars = stars || Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: rnd(0.6, 2), tw: rnd(0, 6), sp: rnd(0.2, 1.2) }));
  }

  // 動くブロックの位置（往復運動）。sin で端がなめらかに
  function curSpeed() { return Math.min(SPEED_MAX, SPEED0 + score * SPEED_UP); }
  function advanceCur(dt) {
    cur.phase += dt * curSpeed() / RANGE;                 // 位相（ラジアン風）
    const off = Math.sin(cur.phase) * RANGE * dirSign * -1;
    if (axisX) cur.cx = cur.baseX + off; else cur.cz = cur.baseZ + off;
  }

  // ================= 投影 =================
  // ワールド (x, z, y) → 画面
  function P(x, z, y) {
    const sx = W / 2 + (x - z) * SC * KX;
    const sy = LOOK_Y + (x + z) * SC * KY - (y - camY) * SC;
    return [sx, sy];
  }

  // ================= ゲーム進行 =================
  function place() {
    if (state === 'ready') { state = 'play'; ac(); return; }
    if (state !== 'play') { if (state === 'over' && deadT > 0.8) { reset(); } return; }

    const top = tower[tower.length - 1];
    const b = cur;
    const sumoX = b.cx, sumoZ = b.cz;                      // 力士はブロックの中心に乗っている
    let delta, size, lo, hi;
    if (axisX) { delta = b.cx - top.cx; size = b.sx; }
    else { delta = b.cz - top.cz; size = b.sz; }
    const over = Math.abs(delta);

    if (over >= size) {                                    // 完全に外した → ブロックごと落下
      state = 'dying';
      falling.push({ ...b, vy: 0, vx: 0, rot: 0, vr: rnd(-1, 1) });
      startSumoFall(sumoX, sumoZ, b.level * BH + BH);
      return;
    }

    // ぴったり？
    if (over <= PERFECT) {
      b.cx = axisX ? top.cx : b.cx;
      b.cz = axisX ? b.cz : top.cz;
      if (axisX) b.cx = top.cx; else b.cz = top.cz;
      perfectChain++; combo = perfectChain;
      // 連続でぴったりなら少し広がる（本家と同じ）
      if (perfectChain >= 5) {
        const grow = 0.04;
        if (axisX) { b.sx = Math.min(START, b.sx + grow); } else { b.sz = Math.min(START, b.sz + grow); }
      }
      sfx.perfect(perfectChain);
      rings.push({ x: b.cx, z: b.cz, y: b.level * BH + BH, sx: b.sx, sz: b.sz, t: 0, hue: b.hue });
      flashT = 0.25;
    } else {
      perfectChain = 0; combo = 0;
      // 切り落とす
      const cut = { ...b, vy: 0, vx: 0, rot: 0, vr: rnd(-1, 1) };
      if (axisX) {
        const newSx = b.sx - over;
        const keepC = (Math.max(b.cx - b.sx / 2, top.cx - top.sx / 2) + Math.min(b.cx + b.sx / 2, top.cx + top.sx / 2)) / 2;
        const cutC = delta > 0 ? keepC + newSx / 2 + over / 2 : keepC - newSx / 2 - over / 2;
        cut.cx = cutC; cut.sx = over; cut.vx = delta > 0 ? 1 : -1;
        b.cx = keepC; b.sx = newSx;
      } else {
        const newSz = b.sz - over;
        const keepC = (Math.max(b.cz - b.sz / 2, top.cz - top.sz / 2) + Math.min(b.cz + b.sz / 2, top.cz + top.sz / 2)) / 2;
        const cutC = delta > 0 ? keepC + newSz / 2 + over / 2 : keepC - newSz / 2 - over / 2;
        cut.cz = cutC; cut.sz = over; cut.vx = delta > 0 ? 1 : -1; cut.axisZ = true;
        b.cz = keepC; b.sz = newSz;
      }
      falling.push(cut);
      sfx.place();
      // 力士が足場から外れていたら落ちる
      const sx0 = b.cx - b.sx / 2, sx1 = b.cx + b.sx / 2, sz0 = b.cz - b.sz / 2, sz1 = b.cz + b.sz / 2;
      if (sumoX < sx0 || sumoX > sx1 || sumoZ < sz0 || sumoZ > sz1) {
        tower.push(b);
        state = 'dying';
        startSumoFall(sumoX, sumoZ, b.level * BH + BH);
        return;
      }
    }

    tower.push(b);
    const before = rankOf(score);
    score = b.level;
    if (rankOf(score) > before) { winT = 1.4; sfx.rank(); }
    cur = newBlock(b.level + 1);
    camTarget = Math.max(0, (b.level - 2) * BH);
    // 力士はぴょんと新しいブロックへ（乗り換えアニメ）
    sumoHop = { t: 0 };
  }
  let sumoHop = null;

  function startSumoFall(x, z, y) {
    sumoFall = { x, z, y, vy: 0.6, vx: 0, t: 0, rot: 0 };
    sfx.fall();
  }

  // ================= 更新 =================
  function update(dt) {
    t0 += dt;
    winT = Math.max(0, winT - dt);
    flashT = Math.max(0, flashT - dt);
    camY += (camTarget - camY) * Math.min(1, dt * 4);
    bgHue = 225 + 45 * Math.sin(score * 0.07);   // 青〜紫〜青緑の範囲でゆっくり変わる
    for (const s of stars) { s.y += s.sp * dt * 6 + (camTarget - camY) * 0; if (s.y > H) s.y = 0; }

    if (sumoHop) { sumoHop.t += dt / 0.28; if (sumoHop.t >= 1) sumoHop = null; }

    if (state === 'play' || state === 'ready') advanceCur(state === 'ready' ? dt * 0.8 : dt);

    for (const f of falling) {
      f.vy -= 4.2 * dt; f.y = (f.y === undefined ? f.level * BH : f.y) + f.vy * dt;
      f.rot += f.vr * dt * 2;
      if (axisXOf(f)) f.cx += f.vx * dt * 0.5; else f.cz += f.vx * dt * 0.5;
    }
    falling = falling.filter(f => f.y > camY - 8);

    for (const r of rings) r.t += dt / 0.55;
    rings = rings.filter(r => r.t < 1);
    for (const p of particles) { p.life -= dt; p.vy += 800 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    particles = particles.filter(p => p.life > 0);

    if (sumoFall) {
      const s = sumoFall; s.t += dt;
      s.vy -= 5.5 * dt; s.y += s.vy * dt; s.rot += dt * 7;
      if (s.t > 1.15 && state === 'dying') { state = 'over'; deadT = 0; if (score > best) { best = score; try { localStorage.setItem('sumo-stack-best', best); } catch {} } }
    }
    if (state === 'over') deadT += dt;
  }
  const axisXOf = f => !f.axisZ;

  // ================= 描画 =================
  function text(g, s, x, yy, size, color = '#fff', stroke = 'rgba(0,0,0,.35)', align = 'center', glow = 0) {   // 淡い背景の上では濃い字（INK）を渡す
    g.font = `${glow ? '300' : 'bold'} ${size}px "Hiragino Sans","Yu Gothic","Meiryo",sans-serif`;
    g.textAlign = align; g.textBaseline = 'middle';
    if (glow) { g.shadowColor = '#ffffff'; g.shadowBlur = glow; }
    g.lineJoin = 'round'; g.lineWidth = size / 6;
    if (stroke) { g.strokeStyle = stroke; g.strokeText(s, x, yy); }
    g.fillStyle = color; g.fillText(s, x, yy);
    g.shadowBlur = 0;
  }

  // 積むのは座布団。上面はふっくら、真ん中に綴じ糸、四すみに房
  const ZAB = [
    { top: '#a77bd0', hi: '#cfb3ea', s1: '#8a5ab8', s2: '#6e4399' },   // 紫
    { top: '#e8808f', hi: '#f6b8c1', s1: '#c85a6c', s2: '#a84457' },   // 紅
    { top: '#6f9ed8', hi: '#a9c8ee', s1: '#527fba', s2: '#3d6296' },   // 藍
    { top: '#7cc08a', hi: '#b2deba', s1: '#5ea26c', s2: '#478555' },   // 若草
    { top: '#f2b566', hi: '#f9d6a0', s1: '#d8923e', s2: '#b87a2e' },   // 橙
  ];
  function drawBlock(g, b, alpha = 1, y0 = null) {
    const y = y0 === null ? b.level * BH : y0;
    const x0 = b.cx - b.sx / 2, x1 = b.cx + b.sx / 2, z0 = b.cz - b.sz / 2, z1 = b.cz + b.sz / 2;
    const top = y + BH;
    const A = P(x0, z0, top), B = P(x1, z0, top), C = P(x1, z1, top), D = P(x0, z1, top);
    const a0 = P(x0, z1, y), b0 = P(x1, z1, y), c0 = P(x1, z0, y);
    const Z = ZAB[b.level % ZAB.length];
    const grad = (p0, p1, c0_, c1_) => { const gr = g.createLinearGradient(p0[0], p0[1], p1[0], p1[1]); gr.addColorStop(0, c0_); gr.addColorStop(1, c1_); return gr; };
    const poly = (pts, fill) => { g.fillStyle = fill; g.beginPath(); g.moveTo(...pts[0]); for (let i = 1; i < pts.length; i++) g.lineTo(...pts[i]); g.closePath(); g.fill(); };
    g.save(); g.globalAlpha = alpha;
    // 側面（少し濃い色）
    poly([D, C, b0, a0], grad(D, a0, Z.s1, Z.s2));
    poly([C, B, c0, b0], grad(C, b0, Z.s2, Z.s2));
    g.fillStyle = 'rgba(0,0,0,.10)'; g.beginPath(); g.moveTo(...C); g.lineTo(...B); g.lineTo(...c0); g.lineTo(...b0); g.closePath(); g.fill();
    // 上面（ふくらんだ四角）
    const cx = (A[0] + B[0] + C[0] + D[0]) / 4, cy = (A[1] + B[1] + C[1] + D[1]) / 4;
    const bulge = 0.12;
    const mid = (p, q) => [(p[0] + q[0]) / 2 + ((p[0] + q[0]) / 2 - cx) * bulge, (p[1] + q[1]) / 2 + ((p[1] + q[1]) / 2 - cy) * bulge];
    const outline = () => { g.beginPath(); g.moveTo(...A); [[A, B], [B, C], [C, D], [D, A]].forEach(([p, q], i) => { const m = mid(p, q); g.quadraticCurveTo(m[0], m[1], q[0], q[1]); }); g.closePath(); };
    outline(); g.fillStyle = grad(A, C, Z.hi, Z.top); g.fill();
    g.strokeStyle = Z.s1; g.lineWidth = 1.2; g.stroke();
    // やわらかい光
    const lg = g.createRadialGradient(cx - 6, cy - 4, 1, cx, cy, Math.max(20, Math.hypot(A[0] - C[0], A[1] - C[1]) * 0.45));
    lg.addColorStop(0, 'rgba(255,255,255,.42)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
    outline(); g.fillStyle = lg; g.fill();
    // 縫い目（ふちの内側の点線）と、真ん中から四すみへの綴じ糸
    const k = 0.76, inset = p => [cx + (p[0] - cx) * k, cy + (p[1] - cy) * k];
    g.save(); g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 1; g.setLineDash([3, 3]);
    g.beginPath(); [A, B, C, D].forEach((p, i) => { const q = inset(p); i ? g.lineTo(...q) : g.moveTo(...q); }); g.closePath(); g.stroke();
    g.setLineDash([]); g.strokeStyle = 'rgba(255,255,255,.28)';
    [A, B, C, D].forEach(p => { const q = inset(p); g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + (q[0] - cx) * 0.8, cy + (q[1] - cy) * 0.8); g.stroke(); });
    g.restore();
    g.fillStyle = Z.s2; g.beginPath(); g.arc(cx, cy, 3, 0, Math.PI * 2); g.fill();
    g.fillStyle = Z.hi; g.beginPath(); g.arc(cx - 0.8, cy - 0.8, 1.1, 0, Math.PI * 2); g.fill();
    // 四すみの房
    [A, B, C, D].forEach(p => { g.fillStyle = '#f4e6a8'; g.strokeStyle = '#b89a40'; g.lineWidth = 0.8; g.beginPath(); g.arc(p[0], p[1], 2.6, 0, Math.PI * 2); g.fill(); g.stroke(); });
    g.restore();
  }

  // ---- 背景: 国技館（吊り屋根・房・升席のお客さん）を、水分多めの淡い水彩で。起動時に1枚の絵に描いておく ----
  let BG = null;
  function buildBg() {
    const S = 2, c = document.createElement('canvas'); c.width = W * S; c.height = H * S;
    const g = c.getContext('2d'); g.scale(S, S);
    let seed = 20261024;
    const R = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const rr = (lo, hi) => lo + R() * (hi - lo);
    // 紙
    const paper = g.createLinearGradient(0, 0, 0, H);
    paper.addColorStop(0, '#e6edf2'); paper.addColorStop(0.5, '#f6f0e4'); paper.addColorStop(1, '#efe3d0');
    g.fillStyle = paper; g.fillRect(0, 0, W, H);
    // にじみ: ゆらした多角形を、うすく重ねて、ふちだけ少し濃くする
    const wash = (pts, col, a, passes = 4, wob = 3) => {
      for (let k = 0; k < passes; k++) {
        g.beginPath(); pts.forEach(([x, y], i) => { const px = x + rr(-wob, wob), py = y + rr(-wob, wob); i ? g.lineTo(px, py) : g.moveTo(px, py); });
        g.closePath(); g.globalAlpha = a; g.fillStyle = col; g.fill();
      }
      g.beginPath(); pts.forEach(([x, y], i) => { const px = x + rr(-1, 1), py = y + rr(-1, 1); i ? g.lineTo(px, py) : g.moveTo(px, py); });
      g.closePath(); g.globalAlpha = a * 0.9; g.strokeStyle = col; g.lineWidth = 1.2; g.stroke(); g.globalAlpha = 1;
    };
    const bloom = (x, y, rad, col, a) => {
      const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.globalAlpha = a; g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2); g.globalAlpha = 1;
    };
    const line = (x0, y0, x1, y1, col, a, w = 1) => { g.globalAlpha = a; g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); g.globalAlpha = 1; };
    // 色のにじみ（先に、ぼんやりと）
    [['#bcd0e6', 70, 120], ['#e9c3d0', 330, 90], ['#d9e7c4', 120, 420], ['#e8d9a8', 320, 360], ['#cdbfe6', 60, 600], ['#f1cdb6', 340, 640]].forEach(([col, x, y]) => bloom(x, y, rr(110, 170), col, rr(0.35, 0.55)));
    // 吊り屋根（天井）
    wash([[-10, -10], [W + 10, -10], [W + 10, 66], [W * 0.88, 148], [W * 0.12, 148], [-10, 66]], '#9bb2c8', 0.17, 5, 4);
    for (let i = 0; i <= 8; i++) { const x = (i / 8) * W, x2 = W * 0.12 + (i / 8) * W * 0.76; line(x, -4, x2, 148, '#6f86a0', 0.16, 1); }
    line(W * 0.12, 148, W * 0.88, 148, '#6f86a0', 0.3, 1.4);
    line(-4, 66, W * 0.12, 148, '#6f86a0', 0.26, 1.2); line(W + 4, 66, W * 0.88, 148, '#6f86a0', 0.26, 1.2);
    // 屋根の下の幕（紫）と菊の紋
    wash([[W * 0.12, 148], [W * 0.88, 148], [W * 0.88, 176], [W * 0.12, 176]], '#b79ad2', 0.24, 4, 2);
    for (let x = W * 0.12 + 22; x < W * 0.88; x += 38) { g.globalAlpha = 0.5; g.fillStyle = '#ffffff'; g.beginPath(); g.arc(x + rr(-1, 1), 162 + rr(-1, 1), 4.2, 0, 7); g.fill(); g.globalAlpha = 0.5; g.fillStyle = '#e6c860'; g.beginPath(); g.arc(x, 162, 1.6, 0, 7); g.fill(); g.globalAlpha = 1; }
    // 四色の房（青・白・赤・黒）
    const fusa = (x, y0, col, edge) => {
      line(x, y0, x, y0 + 18, '#7a6a52', 0.5, 1.4);
      g.globalAlpha = 0.9; g.fillStyle = '#e6c860'; g.beginPath(); g.arc(x, y0 + 19, 3, 0, 7); g.fill(); g.globalAlpha = 1;
      wash([[x - 5, y0 + 21], [x + 5, y0 + 21], [x + 8, y0 + 70], [x - 8, y0 + 70]], col, 0.5, 3, 1.2);
      for (let k = -2; k <= 2; k++) line(x + k * 2.4, y0 + 24, x + k * 3.2, y0 + 68, edge, 0.35, 0.8);
      line(x - 6, y0 + 30, x + 6, y0 + 30, edge, 0.5, 1);
    };
    fusa(40, 104, '#6f94d2', '#2d4f8c'); fusa(80, 148, '#ffffff', '#9aa4b4');
    fusa(W - 80, 148, '#e0686a', '#a33236'); fusa(W - 40, 104, '#5a5a68', '#2a2a36');
    // 升席とお客さん（奥から手前へ。手前ほど大きく）
    const SEAT = ['#f3c6d0', '#c6d8f2', '#d6ecc4', '#f6e2a8', '#d8c9ee', '#f7d0b4'];
    const HEAD = ['#f2d6bd', '#e8c3a3', '#9a9aa8', '#cfcfda', '#5c5c6c'];
    for (let i = 0; i < 9; i++) {
      const y = 262 + i * 46 + i * i * 1.2, sc = 0.7 + i * 0.09, row = 20 * sc;
      wash([[-10, y + row * 0.4], [W + 10, y + row * 0.4], [W + 10, y + row * 2.1], [-10, y + row * 2.1]], '#d9c7a4', 0.16, 2, 2);
      line(-4, y + row * 2.1, W + 4, y + row * 2.1, '#a18b66', 0.22, 1.2);
      for (let x = -rr(0, 10); x < W + 20; x += 24 * sc) {
        const col = SEAT[Math.floor(R() * SEAT.length)];
        if (R() < 0.28) continue;
        g.globalAlpha = 0.5; g.fillStyle = col; g.beginPath(); g.ellipse(x, y + row * 1.5, 9 * sc, 8 * sc, 0, 0, 7); g.fill();
        g.globalAlpha = 0.62; g.fillStyle = HEAD[Math.floor(R() * HEAD.length)]; g.beginPath(); g.arc(x + rr(-1, 1), y + row * 0.85, 4.8 * sc, 0, 7); g.fill();
        g.globalAlpha = 1;
      }
    }
    // まん中は明るく（塔が見やすいように）
    bloom(W / 2, H * 0.52, 340, '#fffdf6', 0.62);
    // ところどころの水たまり
    for (let i = 0; i < 12; i++) bloom(rr(0, W), rr(0, H), rr(40, 110), ['#cfe0f0', '#f4d3dc', '#e3efcf', '#efe0b8', '#dcd0f0'][i % 5], rr(0.12, 0.22));
    // 紙のざらつき
    for (let i = 0; i < 9000; i++) { g.globalAlpha = rr(0.02, 0.06); g.fillStyle = R() < 0.55 ? '#6b5a46' : '#ffffff'; g.fillRect(rr(0, W), rr(0, H), 1, 1); }
    g.globalAlpha = 1;
    BG = c;
  }
  function drawBg(g) {
    if (!BG) buildBg();
    g.drawImage(BG, 0, 0, W, H);
  }

  function drawSumoOn(g, b) {
    // 動くブロックの中心に立つ
    const [fx, fy] = P(b.cx, b.cz, b.level * BH + BH);
    let sy = 1, sx = 1, lift = 0;
    if (sumoHop) { const w = Math.sin(Math.PI * sumoHop.t); lift = w * 16; sy = 1 + w * 0.12; sx = 1 - w * 0.08; }
    const face = winT > 0 ? 'win' : 'normal';
    // 影
    g.fillStyle = 'rgba(0,0,0,.28)'; g.beginPath(); g.ellipse(fx, fy + 2, 16 - lift * 0.3, 6, 0, 0, Math.PI * 2); g.fill();
    drawSumo(g, sumoLv, face, fx, fy - lift, sx, sy);
  }

  // 音のオン・オフのマーク（「どすこい！はなりきし」と同じ形。オフは×で、うすくする）
  function drawSoundIcon(g, cx, cy, size, on, color) {
    const k = size / 40;
    g.save(); g.translate(cx - size / 2, cy - size / 2); g.scale(k, k);
    g.globalAlpha *= on ? 1 : 0.45; g.fillStyle = color; g.strokeStyle = color; g.lineWidth = 2.6; g.lineCap = 'round';
    g.fill(new Path2D('M6 15h7l9-8v26l-9-8H6z'));
    g.stroke(new Path2D(on ? 'M27 13a9 9 0 0 1 0 14M31 9a14 14 0 0 1 0 22' : 'M27 14l10 12M37 14 27 26'));
    g.restore();
  }

  function draw() {
    const g = ctx;
    drawBg(g);

    // 画面外の下の塔は省いて、見える範囲だけ描く
    const lv = rankOf(score);
    sumoLv = lv;
    const start = Math.max(0, Math.floor(camY / BH) - 3);
    const topB = tower[tower.length - 1];
    {
      const [gx, gy] = P(topB.cx, topB.cz, topB.level * BH + BH);
      const glow = g.createRadialGradient(gx, gy, 5, gx, gy, 190);
      glow.addColorStop(0, `hsla(${topB.hue},100%,70%,.14)`); glow.addColorStop(1, `hsla(${topB.hue},100%,60%,0)`);
      g.fillStyle = glow; g.fillRect(0, 0, W, H);
    }
    for (let i = start; i < tower.length; i++) {
      const blk = tower[i];
      const [, sy] = P(blk.cx, blk.cz, blk.level * BH);
      if (sy < -80) continue;
      if (sy > H + 120) continue;
      drawBlock(g, blk, Math.max(0.12, 1 - (tower.length - 1 - i) * 0.04));
    }

    // ぴったりの波紋
    for (const r of rings) {
      const k = r.t, e = 1 + k * 0.5;
      const x0 = r.x - r.sx / 2 * e, x1 = r.x + r.sx / 2 * e, z0 = r.z - r.sz / 2 * e, z1 = r.z + r.sz / 2 * e;
      const A = P(x0, z0, r.y), B = P(x1, z0, r.y), C = P(x1, z1, r.y), D = P(x0, z1, r.y);
      g.strokeStyle = `hsla(${r.hue},100%,88%,${1 - k})`; g.lineWidth = 3 * (1 - k) + 1;
      g.beginPath(); g.moveTo(...A); g.lineTo(...B); g.lineTo(...C); g.lineTo(...D); g.closePath(); g.stroke();
    }

    // 動くブロックと力士（力士が落ちている間は力士を別に描く）
    if (cur && (state === 'play' || state === 'ready')) {
      drawBlock(g, cur);
      drawSumoOn(g, cur);
    }
    // 切り落とした破片
    for (const f of falling) drawBlock(g, f, Math.max(0.2, 1 - Math.max(0, camY * 0)), f.y);
    // 落ちる力士
    if (sumoFall) {
      const s = sumoFall;
      const [fx, fy] = P(s.x, s.z, s.y);
      drawSumo(g, lv, 'hit', fx, fy, 1, 1, s.rot, 1 - Math.min(0.4, s.t * 0.3));
    }

    // 光
    if (flashT > 0) { g.fillStyle = `rgba(255,255,255,${flashT * 0.35})`; g.fillRect(0, 0, W, H); }

    // スコア（本家のように細く光る数字）
    text(g, String(score), W / 2, 92, 74, '#4a3b66', 'rgba(255,255,255,.85)', 'center');
    text(g, RANKS[lv].name, W / 2, 142, 20, '#5a4a6e', 'rgba(255,255,255,.8)');
    const nx = RANKS[lv + 1];
    if (nx) text(g, `${nx.name}まで あと${nx.from - score}`, W / 2, 168, 13, '#7a6a8a', 'rgba(255,255,255,.8)');
    if (combo >= 2 && state === 'play') text(g, `ぴったり ×${combo}`, W / 2, 200, 18, '#c0541a', 'rgba(255,255,255,.9)');
    if (winT > 0) text(g, '出世！ ' + RANKS[lv].name, W / 2, 232, 28, '#d9480f', 'rgba(255,255,255,.9)');

    drawSoundIcon(g, W - 24, 28, 24, !muted, '#4a3b66'); g.textBaseline = 'middle';
    g.font = 'bold 12px sans-serif'; g.textAlign = 'left'; g.fillStyle = '#6a5a7a';
    g.fillText('ベスト ' + best, 14, 28);

    if (state === 'ready') {
      text(g, 'はなりきしスタック', W / 2, 330, 28, '#4a3b66', 'rgba(255,255,255,.9)');
      text(g, 'タップで 座布団を止める', W / 2, 590, 20, '#4a3b66', 'rgba(255,255,255,.9)');
      text(g, '力士の下が空いたら 落ちて OUT', W / 2, 622, 15, '#6a5a7a', 'rgba(255,255,255,.9)');
    }

    if (state === 'over') {
      const a = Math.min(1, deadT / 0.4);
      g.fillStyle = `rgba(250,244,232,${0.78 * a})`; g.fillRect(0, 0, W, H);
      g.globalAlpha = a;
      g.drawImage(IMG.home, W / 2 - 100, 130, 200, 200);
      text(g, 'OUT！', W / 2, 360, 40, '#c0392b', 'rgba(255,255,255,.9)');
      text(g, `${score} 段  ${RANKS[lv].name}`, W / 2, 416, 28, '#4a3b66', 'rgba(255,255,255,.9)');
      text(g, `ベスト ${best}`, W / 2, 456, 20, '#a87008', 'rgba(255,255,255,.9)');
      if (deadT > 0.8) text(g, 'タップで もういちど', W / 2, 520, 22, '#2f8a4a', 'rgba(255,255,255,.9)');
      g.globalAlpha = 1;
    }
  }

  // ================= ループ・入力 =================
  let last = 0;
  function frame(t) {
    toList.hidden = !(state === 'ready' || state === 'over');
    HanaShare.update(state === 'over', `はなりきしスタックで ${score}段つんだ！`);
    HanaRank.update(state === 'over', score, state === 'ready');
    const dt = Math.min(0.033, (t - last) / 1000 || 0);
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  const toCanvas = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); ac();
    const c = toCanvas(e);
    if (c[0] > W - 48 && c[1] < 52) {
      muted = !muted;
      try { localStorage.setItem('sumo-stack-mute', muted ? '1' : '0'); } catch {}
      return;
    }
    place();
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'Enter') { e.preventDefault(); ac(); if (!e.repeat) place(); }
  });

  // 戻る操作（スワイプ・戻るボタン）: 本番中はポーズ。ふだんは前のページへ
  HanaBack.init({ isPlaying: () => state === 'play' });
  loadImages().then(() => {
    buildSprites();
    reset();
    requestAnimationFrame(frame);
  }).catch(err => { document.body.textContent = err.message; });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
