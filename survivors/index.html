  // ================= ドット絵 =================
  function pix(rows, pal) {
    const h = rows.length, w = Math.max(...rows.map(r => r.length));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d');
    rows.forEach((row, y) => [...row].forEach((ch, x) => {
      if (ch !== '.' && pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); }
    }));
    return c;
  }
  function whiteOf(c) {
    const o = document.createElement('canvas'); o.width = c.width; o.height = c.height;
    const g = o.getContext('2d'); g.drawImage(c, 0, 0);
    g.globalCompositeOperation = 'source-in'; g.fillStyle = '#fff'; g.fillRect(0, 0, o.width, o.height);
    return o;
  }

  // 絵の色を変えて、強い敵の見た目を作る。mul=色をかける / hue=色相をまわす
  function recolor(c, fn) {
    const o = document.createElement('canvas'); o.width = c.width; o.height = c.height;
    const g = o.getContext('2d'); g.drawImage(c, 0, 0);
    const d = g.getImageData(0, 0, o.width, o.height), a = d.data;
    for (let i = 0; i < a.length; i += 4) { if (!a[i + 3]) continue; const q = fn(a[i], a[i + 1], a[i + 2]); a[i] = q[0]; a[i + 1] = q[1]; a[i + 2] = q[2]; }
    g.putImageData(d, 0, 0); return o;
  }
  const mul = (c, r, g, b) => recolor(c, (R, G, B) => [Math.min(255, R * r), Math.min(255, G * g), Math.min(255, B * b)]);
  const hue = (c, deg) => recolor(c, (R, G, B) => {
    const k = deg * Math.PI / 180, cs = Math.cos(k), sn = Math.sin(k);
    return [R * (.213 + cs * .787 - sn * .213) + G * (.715 - cs * .715 - sn * .715) + B * (.072 - cs * .072 + sn * .928),
            R * (.213 - cs * .213 + sn * .143) + G * (.715 + cs * .285 + sn * .140) + B * (.072 - cs * .072 - sn * .283),
            R * (.213 - cs * .213 - sn * .787) + G * (.715 - cs * .715 + sn * .715) + B * (.072 + cs * .928 + sn * .072)].map(v => Math.max(0, Math.min(255, v)));
  });

  // 地面タイル（64x64ドット）
  let TILE = null;
  function buildTile() {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d');
    g.fillStyle = '#2a5429'; g.fillRect(0, 0, 64, 64);
    let seed = 7; const rn = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 90; i++) { g.fillStyle = rn() < 0.5 ? '#295427' : '#366634'; g.fillRect((rn() * 64) | 0, (rn() * 64) | 0, 2, 1); }
    for (let i = 0; i < 18; i++) { g.fillStyle = '#3f7a3d'; const x = (rn() * 62) | 0, y = (rn() * 62) | 0; g.fillRect(x, y, 1, 2); g.fillRect(x + 2, y + 1, 1, 2); }
    TILE = c;
  }

  // ---- 力士ドット絵（ランク別、少し荒く縮小して描く） ----
  const IMG = {};
  const BODY_SRC = ['body_color', 'mawashi', 'body_line', 'normal', 'collision', 'win', 'home'];
  const CX = 513, CY = 538, BODY_R = 395;
  function loadImages() {
    return Promise.all(BODY_SRC.map(n => new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => { IMG[n] = i; res(); };
      i.onerror = () => rej(new Error('画像を読み込めません: ' + n));
      i.src = `../parts/${n}.png`;
    })));
  }
  function tint(img, color) {
    const c = document.createElement('canvas'); c.width = c.height = 1024;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0);
    g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, 1024, 1024);
    return c;
  }
  const ART = 22;                                  // 力士の絵の大きさ（ドット）
  function sumoArt(bodyCol, beltCol, face, size = ART) {
    const bodyT = tint(IMG.body_color, bodyCol), beltT = tint(IMG.mawashi, beltCol);
    const big = document.createElement('canvas'); big.width = big.height = 1024;
    const gb = big.getContext('2d');
    gb.drawImage(bodyT, 0, 0); gb.drawImage(beltT, 0, 0); gb.drawImage(IMG.body_line, 0, 0);
    gb.drawImage(face === 'hit' ? IMG.collision : face === 'win' ? IMG.win : IMG.normal, 0, 0);
    const out = document.createElement('canvas'); out.width = out.height = size;

  function tone(f0, f1, dur, type = 'square', vol = 0.04, delay = 0) {

  function recalc() {
    const oldMax = P.maxHp;

        case 'shio':    st.amount += 4; st.pierce = 99; st.cd *= 0.6; st.dmg *= 1.5; break;

  // ================= 武器の更新 =================

  function updateWeapons(dt) {

          projs.push({ type: 'shio', x: P.x, y: P.y - 4, vx: Math.cos(a) * st.speed, vy: Math.sin(a) * st.speed, r: 4, dmg: st.dmg, pierce: st.pierce, life: 1.4, hit: {} });

            for (const e of enemies) {
              if (e.dead) continue;
              if (Math.hypot(e.x - bx, e.y - by) < e.r + 11 * S.area && (!e.hitT.g || gt - e.hitT.g > 0.55)) { e.hitT.g = gt; dmgEnemy(e, st.dmg, P.x, P.y, 34); }
            }
            hitProps(bx, by, 10);
          }
        }
      } else if (w.id === 'tawara') {
        w.cd -= dt;
        for (const p of w.pending) p.t -= dt;
        w.pending = w.pending.filter(p => {
          if (p.t > 0) return true;
          projs.push({ type: 'tawara', x: P.x, y: P.y - 8, vx: rnd(-70, 70) + P.face * 20, vy: -360 - rnd(0, 40), r: 10, dmg: st.dmg, life: 2.4, hit: {}, rot: 0 });
          sfx.throwT();
          return false;
        });
        if (w.cd <= 0) {
          w.cd = st.cd * S.cd;
          for (let k = 0; k < st.amount; k++) w.pending.push({ t: k * 0.14 });
        }
      } else if (w.id === 'nobori') {
        w.cd -= dt;
        for (const p of w.pending) p.t -= dt;
        w.pending = w.pending.filter(p => {
          if (p.t > 0) return true;
          const tg = nearest(p.k + 1, 380)[p.k] || nearest(1, 380)[0];
          const a = tg ? Math.atan2(tg.y - P.y, tg.x - P.x) : (P.face > 0 ? 0 : Math.PI);
          projs.push({ type: 'nobori', x: P.x, y: P.y - 4, vx: Math.cos(a) * 230, vy: Math.sin(a) * 230, r: 11 * st.size * S.area, dmg: st.dmg, life: 4, t: 0, rot: 0, hit: {}, size: st.size });
          sfx.throwT();
          return false;
        });
        if (w.cd <= 0 && enemies.length) { w.cd = st.cd * S.cd; for (let k = 0; k < st.amount; k++) w.pending.push({ t: k * 0.18, k }); }
      } else if (w.id === 'inazuma') {
        w.cd -= dt;
        if (w.cd <= 0 && enemies.length) {
          w.cd = st.cd * S.cd;
          const vis = enemies.filter(e => !e.dead && Math.abs(e.x - P.x) < W / 2 && Math.abs(e.y - P.y) < H / 2);
          for (let k = 0; k < st.amount && vis.length; k++) {
            const e = vis.splice(Math.floor(Math.random() * vis.length), 1)[0];
            const R = st.radius * S.area, tx = e.x, ty = e.y;
            for (const o of enemies) if (!o.dead && Math.hypot(o.x - tx, o.y - ty) < R + o.r) dmgEnemy(o, st.dmg, tx, ty, 14);
            hitProps(tx, ty, R);
            bolts.push({ x: tx, y: ty, t: 0.22, r: R });
          }
          sfx.zap();
        }
      } else if (w.id === 'shiko') {
        w.tick -= dt;
        w.ripple = (w.ripple || 0) + dt;
        if (w.tick <= 0) {
          w.tick = st.tick * S.cd;
          const R = st.radius * S.area;
          let any = false;
          for (const e of enemies) {
            if (e.dead) continue;
            if (Math.hypot(e.x - P.x, e.y - P.y) < R + e.r) { dmgEnemy(e, st.dmg, P.x, P.y, 18); any = true; }
          }
          hitProps(P.x, P.y, R);
          w.ripple = 0;
          if (any) sfx.stomp();
        }
      }
    }
  }

  function updateProjs(dt) {
    for (const p of projs) {
      p.life -= dt;
      if (p.type === 'tawara') { p.vy += 640 * dt; p.rot += dt * 8; }
      if (p.type === 'nobori') {
        p.t += dt; p.rot += dt * 9;
        if (p.t > 0.75) {                       // 戻ってくる
          const dx = P.x - p.x, dy = P.y - 4 - p.y, d = Math.hypot(dx, dy) || 1, sp = 260 + (p.t - 0.75) * 260;
          p.vx = dx / d * sp; p.vy = dy / d * sp;
          if (d < 12) p.life = 0;
        }
      }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.type === 'shio') {
        for (const e of enemies) {
          if (e.dead || p.hit[e.id]) continue;
          if (Math.hypot(e.x - p.x, e.y - p.y) < e.r + p.r) {
            p.hit[e.id] = 1; dmgEnemy(e, p.dmg, p.x - p.vx * 0.05, p.y - p.vy * 0.05, 24);
            p.pierce--; if (p.pierce <= 0) { p.life = 0; break; }
          }
        }
        hitProps(p.x, p.y, p.r);
      } else if (p.type === 'nobori') {
        for (const e of enemies) {
          if (e.dead) continue;
          if (Math.hypot(e.x - p.x, e.y - p.y) < e.r + p.r && (!p.hit[e.id] || gt - p.hit[e.id] > 0.4)) { p.hit[e.id] = gt; dmgEnemy(e, p.dmg, p.x, p.y, 22); }
        }
        hitProps(p.x, p.y, p.r);
      } else if (p.type === 'tawara') {
        for (const e of enemies) {
          if (e.dead) continue;
          if (Math.hypot(e.x - p.x, e.y - p.y) < e.r + p.r && (!p.hit[e.id] || gt - p.hit[e.id] > 0.45)) { p.hit[e.id] = gt; dmgEnemy(e, p.dmg, p.x, p.y + 20, 20); }
        }
        hitProps(p.x, p.y, p.r);
      }
    }
    projs = projs.filter(p => p.life > 0);
  }

  // ================= 更新 =================
  function addXp(v) {
    xp += v;
    while (xp >= xpNeed && state === 'play') {
      xp -= xpNeed; level++; xpNeed = xpFor(level);
      openLevelUp();
    }
  }

  function makeChoices() {
    const pool = [];
    for (const [id, d] of Object.entries(WEAPONS)) {
      const w = weapons.find(x => x.id === id);
      if (w) { if (w.lv < d.max) pool.push({ kind: 'w', id, lv: w.lv + 1 }); }
      else if (weapons.length < MAX_WEAPONS) pool.push({ kind: 'w', id, lv: 1 });
    }
    for (const [id, d] of Object.entries(PASSIVES)) {
      const v = pv(id);
      if (v > 0) { if (v < d.max) pool.push({ kind: 'p', id, lv: v + 1 }); }
      else if (Object.keys(passives).length < MAX_PASSIVES) pool.push({ kind: 'p', id, lv: 1 });
    }
    const out = [];
    for (const w of weapons) if (canEvolve(w) && out.length < 3) out.push({ kind: 'evo', id: w.id });
    while (out.length < 3 && pool.length) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    if (!out.length) out.push({ kind: 'heal' });
    return out;
  }

  function openLevelUp() {
    choices = makeChoices();
    state = 'levelup';
    sfx.level();
  }

  function applyChoice(c) {
    if (c.kind === 'w') addWeapon(c.id);
    else if (c.kind === 'evo') evolve(c.id);
    else if (c.kind === 'p') { passives[c.id] = (passives[c.id] || 0) + 1; recalc(); }
    else { P.hp = P.maxHp; coins += 50; }
    state = 'play';
    // 続けてレベルが上がっている場合
    if (xp >= xpNeed) addXp(0);
  }

  function hurt(dmg) {
    if (P.iframe > 0) return;
    const d = Math.max(1, Math.round(dmg - S.armor));
    P.hp -= d; P.iframe = 0.75; P.hurtT = 0.2; shake = 0.15;
    sfx.hurt();
    if (P.hp <= 0) { P.hp = 0; endGame(false); }
  }

  function endGame(win) {
    state = win ? 'win' : 'over';
    over = { t: 0 };
    if (win) sfx.win(); else sfx.over();
    if (gt > best.time || kills > best.kills) {
      best = { time: Math.max(best.time, Math.floor(gt)), kills: Math.max(best.kills, kills) };
      try { localStorage.setItem('sumo-surv-best', JSON.stringify(best)); } catch {}
    }
  }
  let over = { t: 0 };

  function update(dt) {
    shake = Math.max(0, shake - dt);
    if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
    for (const n of nums) { n.t -= dt; n.y -= 24 * dt; }
    nums = nums.filter(n => n.t > 0);
    for (const f of fx) { f.t -= dt; f.vy += 200 * dt; f.x += f.vx * dt; f.y += f.vy * dt; }
    fx = fx.filter(f => f.t > 0);
    for (const s of swings) s.t += dt;
    swings = swings.filter(s => s.t < 0.22);
    for (const b of bolts) b.t -= dt;
    bolts = bolts.filter(b => b.t > 0);

    if (state === 'over' || state === 'win') { over.t += dt; return; }
    if (state !== 'play') return;

    gt += dt;
    if (rankOf(gt) > lastRank) { lastRank = rankOf(gt); banner = { text: '出世！ ' + RANKS[lastRank].name, t: 2.2, color: '#ffd24a' }; sfx.level(); }
    if (gt >= WIN_TIME) return endGame(true);

    // ---- プレイヤー移動 ----
    let ix = 0, iy = 0;
    if (keys.ArrowLeft || keys.KeyA) ix -= 1;
    if (keys.ArrowRight || keys.KeyD) ix += 1;
    if (keys.ArrowUp || keys.KeyW) iy -= 1;
    if (keys.ArrowDown || keys.KeyS) iy += 1;
    if (joy) { ix += joy.dx; iy += joy.dy; }
    const il = Math.hypot(ix, iy);
    if (il > 1) { ix /= il; iy /= il; }
    P.moving = il > 0.05;
    if (P.moving) {
      P.x += ix * P.speed * S.speed * dt; P.y += iy * P.speed * S.speed * dt;
      if (Math.abs(ix) > 0.2) P.face = ix > 0 ? 1 : -1;
      P.walkT += dt * 12;
    }
    P.iframe = Math.max(0, P.iframe - dt);
    P.hurtT = Math.max(0, P.hurtT - dt);
    if (S.regen) P.hp = Math.min(P.maxHp, P.hp + S.regen * dt);
    camX += (P.x - camX) * Math.min(1, dt * 8); camY += (P.y - camY) * Math.min(1, dt * 8);

    spawnUpdate(dt);
    updateWeapons(dt);
    updateProjs(dt);

    // ---- 敵の移動 ----
    const grid = new Map();
    for (const e of enemies) { const k = ((e.x / 22) | 0) * 4096 + ((e.y / 22) | 0); let a = grid.get(k); if (!a) grid.set(k, a = []); a.push(e); }
    for (const e of enemies) {
      const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1;
      let vx = dx / d * e.spd, vy = dy / d * e.spd;
      if (e.orbit) {   // 囲い: プレイヤーのまわりをまわりながら、半径をちぢめる
        const o = e.orbit, t = gt - o.t0, rr = Math.max(14, o.r0 - t * 16);
        const an = o.a0 + t * 0.32;
        e.x += (P.x + Math.cos(an) * rr - e.x) * Math.min(1, dt * 6); e.y += (P.y + Math.sin(an) * rr - e.y) * Math.min(1, dt * 6);
        e.kx = e.ky = 0; e.flash = Math.max(0, e.flash - dt);
        if (!e.dead && Math.hypot(P.x - e.x, P.y - e.y) < e.r + 7) hurt(e.dmg);
        if (rr <= 14) e.orbit = null;
        continue;
      }
      if (ENEMY[e.type].dash) {   // 天狗: ときどき まっすぐ突進
        e.dashT = (e.dashT === undefined ? rnd(1, 3) : e.dashT) - dt;
        if (e.dashT < 0 && e.dashT > -0.5) { if (!e.dd) e.dd = [dx / d, dy / d]; vx = e.dd[0] * e.spd * 4; vy = e.dd[1] * e.spd * 4; }
        else if (e.dashT <= -0.5) { e.dashT = rnd(2.5, 4); e.dd = null; }
      }
      if (ENEMY[e.type].wave) { e.wob += dt * 5; vx += -dy / d * Math.sin(e.wob) * 40; vy += dx / d * Math.sin(e.wob) * 40; }
      // 重なりをほどく
      const cx = (e.x / 22) | 0, cy = (e.y / 22) | 0;
      let sx = 0, sy = 0;
      for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
        const a = grid.get((cx + i) * 4096 + (cy + j)); if (!a) continue;
        for (const o of a) {
          if (o === e) continue;
          const ox = e.x - o.x, oy = e.y - o.y, od = Math.hypot(ox, oy);
          const min = (e.r + o.r) * 0.8;
          if (od > 0 && od < min) { sx += ox / od * (min - od); sy += oy / od * (min - od); }
        }
      }
      vx += sx * 14; vy += sy * 14;
      e.x += (vx + e.kx) * dt; e.y += (vy + e.ky) * dt;
      e.kx *= Math.max(0, 1 - dt * 7); e.ky *= Math.max(0, 1 - dt * 7);
      e.flash = Math.max(0, e.flash - dt);
      if (!e.dead && d < e.r + 7) hurt(e.dmg);
      // 遠くへ行きすぎたら画面の反対側へ（ボスと群れは除く）
      if (!e.boss && !e.swarm && d > 560) { const a = Math.atan2(-dy, -dx) + rnd(-0.6, 0.6); const R = Math.hypot(W, H) / 2 + 40; e.x = P.x + Math.cos(a + Math.PI) * R; e.y = P.y + Math.sin(a + Math.PI) * R; }
      if (e.swarm && d > 700) e.dead = true;
    }
    enemies = enemies.filter(e => !e.dead);

    // ---- 宝石 ----
    const pick = 80 * S.magnet;
    for (const g of gems) {
      g.t += dt;
      const dx = P.x - g.x, dy = P.y - g.y, d = Math.hypot(dx, dy) || 1;
      if (!g.mag && d < pick) g.mag = true;
      if (g.mag) { const sp = 160 + g.t * 220; g.x += dx / d * sp * dt; g.y += dy / d * sp * dt; }
      if (d < 9) { g.got = true; addXp(g.v); gemStreak = gt - lastGem < 0.25 ? gemStreak + 1 : 0; lastGem = gt; sfx.gem(gemStreak); }
    }
    gems = gems.filter(g => !g.got);
    if (gems.length > 700) gems.splice(0, gems.length - 700);
    if (gems.length > 160 && gt - (lastVac || 0) > 25) { lastVac = gt; for (const g of gems) g.mag = true; }

    // ---- アイテム ----
    for (const it of items) {
      const d = Math.hypot(P.x - it.x, P.y - it.y);
      if (d < 16 + 10 * S.magnet) {
        it.got = true;
        if (it.kind === 'coin') { coins += 10; sfx.coin(); }
        else if (it.kind === 'magnet') { for (const g of gems) g.mag = true; banner = { text: '経験値を すいよせた！', t: 1.6, color: '#8ac8ff' }; sfx.heal(); }
        else if (it.kind === 'bowl') { P.hp = Math.min(P.maxHp, P.hp + 30); sfx.heal(); nums.push({ x: P.x, y: P.y - 20, v: '+30', t: 0.8, heal: true }); }
        else if (it.kind === 'chest') {
          sfx.chest();
          const c = makeChoices()[0];
          if (c && c.kind !== 'heal') {
            applyChoiceNoState(c);
            if (c.kind !== 'evo') banner = { text: `宝箱！ ${(c.kind === 'w' ? WEAPONS : PASSIVES)[c.id].name} Lv.${c.lv}`, t: 2.4, color: '#ffe27a' };
          } else { P.hp = P.maxHp; coins += 50; }
        }
      }
    }
    items = items.filter(i => !i.got);
  }
  function applyChoiceNoState(c) {
    if (c.kind === 'w') addWeapon(c.id);
    else if (c.kind === 'evo') evolve(c.id);
    else if (c.kind === 'p') { passives[c.id] = (passives[c.id] || 0) + 1; recalc(); }
  }

  // ================= 描画 =================
  const sx = x => Math.round(x - camX + W / 2);
  const sy = y => Math.round(y - camY + H / 2);

  function drawSpr(g, spr, x, y, scale = PX, flip = false, rot = 0) {
    const w = spr.width * scale, h = spr.height * scale;
    g.save();
    g.translate(Math.round(x), Math.round(y));
    if (rot) g.rotate(rot);
    if (flip) g.scale(-1, 1);
    g.drawImage(spr, -w / 2, -h / 2, w, h);
    g.restore();
  }

  function text(g, s, x, yy, size, color = '#fff', stroke = '#000', align = 'center', bold = true) {
    g.font = `${bold ? 'bold ' : ''}${size}px "Hiragino Sans","Yu Gothic","Meiryo",monospace`;
    g.textAlign = align; g.textBaseline = 'middle';
    g.lineJoin = 'round'; g.lineWidth = Math.max(2, size / 4);
    if (stroke) { g.strokeStyle = stroke; g.strokeText(s, x, yy); }
    g.fillStyle = color; g.fillText(s, x, yy);
  }

  function drawGround(g) {
    const T = 64 * PX;
    const ox = -(((camX - W / 2) % T) + T) % T, oy = -(((camY - H / 2) % T) + T) % T;
    for (let x = ox - T; x < W + T; x += T) for (let y = oy - T; y < H + T; y += T) g.drawImage(TILE, Math.round(x), Math.round(y), T, T);
    // 飾り（草・花・岩・茂み）
    const CELL = 96;
    const i0 = Math.floor((camX - W / 2) / CELL) - 1, i1 = Math.floor((camX + W / 2) / CELL) + 1;
    const j0 = Math.floor((camY - H / 2) / CELL) - 1, j1 = Math.floor((camY + H / 2) / CELL) + 1;
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
      const h = hash(i, j);
      if (h % 100 > 62) continue;
      const wx = i * CELL + (h >>> 8) % CELL, wy = j * CELL + (h >>> 16) % CELL;
      const k = (h >>> 4) % 10;
      const spr = k < 4 ? SPR.tuft : k < 5 ? SPR.flowerR : k < 6 ? SPR.flowerY : k < 7 ? SPR.flowerB : k < 9 ? SPR.bush : SPR.rock;
      drawSpr(g, spr, sx(wx), sy(wy));
    }
  }

  function drawEnemy(g, e) {
    const x = sx(e.x), y = sy(e.y);
    if (x < -50 || x > W + 50 || y < -50 || y > H + 50) return;
    const fl = e.flash > 0;
    const faceRight = P.x > e.x;
    if (e.type === 'bat') {
      const fr = Math.floor(performance.now() / 110 + e.id) % 2;
      drawSpr(g, (fl ? SPR.batW : SPR.bat)[fr], x, y - 2, PX, !faceRight);
    } else if (e.type === 'ghost') {
      drawSpr(g, fl ? SPR.ghostW : SPR.ghost, x, y + Math.sin(performance.now() / 260 + e.id) * 2, PX, !faceRight);
    } else if (e.type === 'skel') {
      const b = Math.floor(performance.now() / 190 + e.id) % 2;
      drawSpr(g, fl ? SPR.skelW : SPR.skel, x, y - b, PX, !faceRight);
    } else if (e.type === 'rival') {
      const b = Math.floor(performance.now() / 230 + e.id) % 2;
      drawSpr(g, fl ? RIVAL.flash : (e.flash > 0 ? RIVAL.hit : RIVAL.normal), x, y - b * 1.5, PX * 1.15, !faceRight);
    } else if (e.type === 'batB') {
      const fr = Math.floor(performance.now() / 90 + e.id) % 2;
      drawSpr(g, (fl ? SPR.batBW : SPR.batB)[fr], x, y - 2, PX, !faceRight);
    } else if (e.type === 'ghostD') {
      drawSpr(g, fl ? SPR.ghostDW : SPR.ghostD, x, y + Math.sin(performance.now() / 260 + e.id) * 2, PX * 1.2, !faceRight);
    } else if (e.type === 'skelR') {
      const b = Math.floor(performance.now() / 150 + e.id) % 2;
      drawSpr(g, fl ? SPR.skelRW : SPR.skelR, x, y - b, PX * 1.1, !faceRight);
    } else if (e.type === 'tengu') {
      const b = Math.floor(performance.now() / 140 + e.id) % 2;
      drawSpr(g, fl ? SPR.tenguW : SPR.tengu, x, y - b * 1.5, PX * 1.15, !faceRight);
    } else if (e.type === 'rivalD') {
      const b = Math.floor(performance.now() / 230 + e.id) % 2;
      drawSpr(g, fl ? RIVAL2.flash : (e.flash > 0 ? RIVAL2.hit : RIVAL2.normal), x, y - b * 1.5, PX * 1.3, !faceRight);
    } else if (e.type === 'oni' || e.type === 'oniB' || e.type === 'oniK' || e.type === 'oniD') {
      const OS = { oni: [SPR.oni, SPR.oniW], oniB: [SPR.oniB, SPR.oniBW], oniK: [SPR.oniK, SPR.oniKW], oniD: [SPR.oniD, SPR.oniDW] }[e.type];
      const b = Math.floor(performance.now() / 200) % 2;
      g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(x, y + 16, 18, 6, 0, 0, Math.PI * 2); g.fill();
      drawSpr(g, fl ? OS[1] : OS[0], x, y - b * 2, PX * (e.type === 'oni' ? 1.6 : e.type === 'oniB' ? 1.8 : e.type === 'oniK' ? 2 : 2.3), !faceRight);
      // ボスの体力
      const w = 44, p = Math.max(0, e.hp / e.maxHp);
      g.fillStyle = '#000'; g.fillRect(x - w / 2 - 1, y - 38, w + 2, 6);
      g.fillStyle = '#c0392b'; g.fillRect(x - w / 2, y - 37, w * p, 4);
    }
  }

  // 張り手（突っ張り）: 腕をのばし、指を上にした手のひらで前へ突く
  function drawSwing(g, s) {
    const k = s.t / 0.22, x = sx(s.x), y = sy(s.y);
    const sc = s.len / 96;                               // 範囲が広がると手も大きくなる
    const R = (c, rx, ry, w, h) => { g.fillStyle = c; g.fillRect(Math.round(rx), Math.round(ry), Math.round(w), Math.round(h)); };
    const O = '#6b2f12', Sk = '#f4b987', Lt = '#ffd9b0', Dk = '#d98f5a';
    // 突く→戻る（0〜0.5で突き出し、そのあと少し戻る）
    const out = k < 0.5 ? 1 - (1 - k / 0.5) ** 3 : 1 - (k - 0.5) / 0.5 * 0.25;
    const reach = (s.len - 40) * out;                    // 腕ののび
    g.save(); g.translate(x, y); g.scale(s.dir, 1);
    g.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
    // 勢いの線
    g.fillStyle = 'rgba(255,255,255,.7)';
    for (let i = -1; i <= 1; i++) g.fillRect(14, i * 13 * sc - 7, Math.max(0, reach - 8), 2);
    const drawHand = (hx, alpha) => {
      g.save(); g.globalAlpha *= alpha; g.translate(hx, -6); g.scale(sc, sc);
      // 腕
      const L = Math.max(4, hx - 8);
      g.save(); g.translate(-hx + 8, 0);
      R(O, 0, -8, L + 6, 16); R(Sk, 0, -7, L + 5, 14); R(Lt, 0, -7, L + 5, 4); R(Dk, 0, 3, L + 5, 4);
      g.restore();
      // 指（上向き・4本）
      for (let i = 0; i < 4; i++) {
        const fx = -9 + i * 5, fh = [15, 19, 18, 14][i];
        R(O, fx - 1, -9 - fh, 6, fh + 6); R(Sk, fx, -8 - fh, 4, fh + 4); R(Lt, fx, -8 - fh, 2, fh + 4);
      }
      // 手のひら
      R(O, -11, -10, 22, 24); R(Sk, -10, -9, 20, 22); R(Lt, -10, -9, 20, 4); R(Dk, -10, 8, 20, 5);
      R(Dk, -6, 0, 12, 1);                               // てのひらのしわ
      // 親指（手前側）
      R(O, -17, -2, 8, 12); R(Sk, -16, -1, 6, 10); R(Lt, -16, -1, 3, 10);
      g.restore();
    };
    drawHand(8 + reach * 0.62, 0.35);                    // 残像
    drawHand(8 + reach, 1);
    // 突いた瞬間の衝撃
    if (k > 0.25 && k < 0.75) {
      const px = 8 + reach + 20 * sc, e = (k - 0.25) / 0.5;
      g.fillStyle = '#fff6c8';
      for (const [dx, dy] of [[0, -22], [10, -8], [12, 8], [0, 22], [-4, -34]]) g.fillRect(px + dx * (1 + e * 1.6) - 2, dy * (1 + e * 1.2) - 8, 5, 5);
    }
    g.restore(); g.globalAlpha = 1;
  }

  function drawGunbai(g, x, y, a) {
    g.save(); g.translate(x, y); g.rotate(a + Math.PI / 2);
    g.scale(0.34 * S.area, 0.34 * S.area);
    g.fillStyle = '#6b4423'; g.fillRect(-3, 0, 6, 18);
    g.beginPath();
    g.moveTo(0, -2);
    g.bezierCurveTo(-12, -4, -19, -18, -19, -31);
    g.bezierCurveTo(-19, -44, -10, -53, 0, -53);
    g.bezierCurveTo(10, -53, 19, -44, 19, -31);
    g.bezierCurveTo(19, -18, 12, -4, 0, -2);
    g.closePath();
    g.fillStyle = '#2b1810'; g.fill();
    g.strokeStyle = '#d4af37'; g.lineWidth = 4; g.stroke();
    g.fillStyle = '#d4af37'; g.beginPath(); g.arc(0, -31, 6, 0, Math.PI * 2); g.fill();
    g.restore();
  }

  function drawWorld(g) {
    drawGround(g);
    // かがり火
    for (const p of props) drawSpr(g, SPR.brazier, sx(p.x), sy(p.y) - 6);
    // 四股の輪
    for (const w of weapons) {
      if (w.id !== 'shiko') continue;
      const st = wstat(w), R = st.radius * S.area, x = sx(P.x), y = sy(P.y) + 4;
      g.globalAlpha = 0.16 + 0.12 * Math.max(0, 1 - (w.ripple || 0) * 3);
      g.fillStyle = '#ff8a8a'; g.beginPath(); g.ellipse(x, y, R, R * 0.82, 0, 0, Math.PI * 2); g.fill();
      g.globalAlpha = 0.5; g.strokeStyle = '#ffd0d0'; g.lineWidth = 2; g.beginPath(); g.ellipse(x, y, R, R * 0.82, 0, 0, Math.PI * 2); g.stroke();
      const rr = R * Math.min(1, (w.ripple || 0) * 5);
      if (rr > 0 && rr < R) { g.globalAlpha = 0.5 * (1 - rr / R); g.strokeStyle = '#fff'; g.beginPath(); g.ellipse(x, y, rr, rr * 0.82, 0, 0, Math.PI * 2); g.stroke(); }
      g.globalAlpha = 1;
    }
    // 宝石・アイテム
    for (const gm of gems) {
      const x = sx(gm.x), y = sy(gm.y);
      if (x < -10 || x > W + 10 || y < -10 || y > H + 10) continue;
      const spr = gm.kind === 'R' ? SPR.gemR : gm.kind === 'G' ? SPR.gemG : SPR.gem;
      drawSpr(g, spr[0], x, y + Math.sin(gm.t * 4) * 1);
    }
    for (const it of items) {
      const x = sx(it.x), y = sy(it.y) + Math.sin(performance.now() / 300) * 1.5;
      drawSpr(g, it.kind === 'chest' ? SPR.chest : it.kind === 'bowl' ? SPR.bowl : it.kind === 'magnet' ? SPR.magnet : SPR.coin[0], x, y, PX);
    }
    // 敵（奥から手前の順）
    enemies.sort((a, b) => a.y - b.y);
    for (const e of enemies) drawEnemy(g, e);
    // 飛び道具
    for (const p of projs) {
      const x = sx(p.x), y = sy(p.y);
      if (p.type === 'shio') {
        g.fillStyle = '#9ad0ff'; g.fillRect(Math.round(x - p.vx * 0.02) - 2, Math.round(y - p.vy * 0.02) - 2, 4, 4);
        g.fillStyle = '#ffffff'; g.fillRect(x - 3, y - 3, 6, 6);
        g.fillStyle = '#cfe9ff'; g.fillRect(x - 1, y - 5, 2, 10); g.fillRect(x - 5, y - 1, 10, 2);
      } else if (p.type === 'nobori') {
        g.save(); g.translate(x, y); g.rotate(p.rot); g.scale(p.size * S.area, p.size * S.area);
        g.fillStyle = '#5a3a1a'; g.fillRect(-1.5, -12, 3, 24);
        g.fillStyle = '#e0302a'; g.fillRect(1.5, -12, 12, 18);
        g.fillStyle = '#ffffff'; g.fillRect(4, -8, 6, 2); g.fillRect(4, -3, 6, 2); g.fillRect(4, 2, 6, 2);
        g.strokeStyle = '#2a0a0a'; g.lineWidth = 1.5; g.strokeRect(1.5, -12, 12, 18);
        g.restore();
      } else {
        g.save(); g.translate(x, y); g.rotate(p.rot);
        g.fillStyle = '#d8b25e'; g.fillRect(-9, -7, 18, 14);
        g.fillStyle = '#8a6a2a'; g.fillRect(-3, -7, 2, 14); g.fillRect(3, -7, 2, 14);
        g.strokeStyle = '#3a2a10'; g.lineWidth = 2; g.strokeRect(-9, -7, 18, 14);
        g.restore();
      }
    }
    // プレイヤー
    drawPlayer(g);
    for (const s of swings) drawSwing(g, s);
    for (const b of bolts) {
      const x = sx(b.x), y = sy(b.y), k = b.t / 0.22;
      g.globalAlpha = Math.min(1, k * 2);
      g.fillStyle = 'rgba(255,255,160,.35)'; g.beginPath(); g.ellipse(x, y, b.r, b.r * 0.8, 0, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#fffbd0'; g.lineWidth = 4; g.lineJoin = 'miter';
      g.beginPath(); g.moveTo(x, y - 380);
      for (let i = 1; i <= 7; i++) g.lineTo(x + (i % 2 ? 1 : -1) * (14 - i * 1.5) * (0.6 + (b.x * 13 % 7) / 7), y - 380 + i * 54);
      g.lineTo(x, y); g.stroke();
      g.strokeStyle = '#7ad0ff'; g.lineWidth = 1.5; g.stroke();
      g.globalAlpha = 1;
    }
    for (const w of weapons) if (w.id === 'gunbai' && w.bodies) for (const b of w.bodies) drawGunbai(g, sx(b.x), sy(b.y), b.a);
    // 破片・数字
    for (const f of fx) { g.globalAlpha = Math.min(1, f.t * 4); g.fillStyle = f.c; g.fillRect(sx(f.x), sy(f.y), 3, 3); }
    g.globalAlpha = 1;
    for (const n of nums) {
      g.globalAlpha = Math.min(1, n.t * 3);
      text(g, String(n.v), sx(n.x), sy(n.y), 10, n.heal ? '#7aff9a' : '#ffffff', '#6a0000', 'center');
    }
    g.globalAlpha = 1;
  }

  function drawPlayer(g) {
    const rk = rankOf(gt);
    const sp = SUMO[rk];
    const x = sx(P.x), y = sy(P.y);
    const blink = P.iframe > 0 && Math.floor(performance.now() / 70) % 2 === 0;
    g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(x, y + 11, 11, 4, 0, 0, Math.PI * 2); g.fill();
    const bob = P.moving ? Math.abs(Math.sin(P.walkT)) * -3 : Math.sin(performance.now() / 400) * 0.6;
    const tilt = P.moving ? Math.sin(P.walkT) * 0.12 : 0;
    g.save();
    if (blink) g.globalAlpha = 0.45;
    const img = state === 'over' ? sp.hit : P.hurtT > 0 ? sp.hit : (banner && banner.color === '#ffd24a' && banner.t > 0.5 ? sp.win : sp.normal);
    drawSpr(g, img, x, y + bob, PX, P.face < 0, tilt);
    g.restore();
    // 体力バー
    const w = 26, p = Math.max(0, P.hp / P.maxHp);
    g.fillStyle = '#300'; g.fillRect(x - w / 2, y + 16, w, 4);
    g.fillStyle = '#e02020'; g.fillRect(x - w / 2, y + 16, Math.round(w * p), 4);
  }

  function iconBox(g, x, y, size, icon, color, lv, maxLv, evo) {
    g.fillStyle = '#10141f'; g.fillRect(x, y, size, size);
    g.strokeStyle = evo ? '#ff7a2a' : '#d4af37'; g.lineWidth = 2; g.strokeRect(x + 1, y + 1, size - 2, size - 2);

    if (lv) text(g, evo ? '★' : String(lv), x + size - 3, y + size - 3, Math.max(9, size * 0.3), evo ? '#ff9a4a' : maxLv ? '#ffd24a' : '#fff', '#000', 'right');
  }

  function fmt(t) { t = Math.floor(t); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); }

  function drawHud(g) {
    // 経験値バー（本家のように画面上端いっぱい）
    g.fillStyle = '#05060c'; g.fillRect(0, 0, W, 16);
    g.fillStyle = '#2a63d8'; g.fillRect(2, 2, (W - 4) * Math.min(1, xp / xpNeed), 12);
    g.fillStyle = '#6fa8ff'; g.fillRect(2, 2, (W - 4) * Math.min(1, xp / xpNeed), 4);
    g.strokeStyle = '#d4af37'; g.lineWidth = 2; g.strokeRect(1, 1, W - 2, 14);
    text(g, `LV ${level}  ${RANKS[rankOf(gt)].name}`, W - 6, 9, 10, '#fff', '#000', 'right');
    // 武器・アイテム
    let ix = 4;
    for (const w of weapons) { const d = WEAPONS[w.id]; iconBox(g, ix, 20, 22, w.evo ? EVO[w.id].icon : d.icon, d.color, w.lv, w.lv >= d.max, w.evo); ix += 24; }
    ix = 4;
    for (const [id, v] of Object.entries(passives)) { const d = PASSIVES[id]; iconBox(g, ix, 44, 20, d.icon, d.color, v, v >= d.max); ix += 22; }
    // タイマー
    text(g, fmt(gt), W / 2, 34, 22, '#fff', '#000');
    // 撃破・小判
    text(g, `撃破 ${kills}`, W - 8, 30, 12, '#fff', '#000', 'right');
    g.fillStyle = '#ffd43b'; g.fillRect(W - 62, 42, 8, 8);
    text(g, String(coins), W - 8, 46, 12, '#ffd24a', '#000', 'right');
    // 音・ポーズ
    g.font = '18px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
    drawSoundIcon(g, W - 20, 70, 22, !muted, '#f5dc8c');
    g.fillText('⏸', W - 48, 70);
  }

  function drawJoy(g) {
    if (!joy) return;
    g.globalAlpha = 0.35; g.strokeStyle = '#fff'; g.lineWidth = 3;
    g.beginPath(); g.arc(joy.ox, joy.oy, 46, 0, Math.PI * 2); g.stroke();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(joy.ox + joy.dx * 36, joy.oy + joy.dy * 36, 20, 0, Math.PI * 2); g.fill();
    g.globalAlpha = 1;
  }

  const CARD = { x: 24, w: W - 48, h: 92, gap: 10, y0: 190 };
  function drawLevelUp(g) {
    g.fillStyle = 'rgba(0,0,12,.7)'; g.fillRect(0, 0, W, H);
    text(g, '番付アップ！', W / 2, 138, 28, '#ffd24a', '#000');
    text(g, `LV ${level}  ${RANKS[rankOf(gt)].name}`, W / 2, 168, 14, '#fff', '#000');
    choices.forEach((c, i) => {
      const x = CARD.x, y = CARD.y0 + i * (CARD.h + CARD.gap);
      g.fillStyle = '#0e1430'; g.fillRect(x, y, CARD.w, CARD.h);
      g.strokeStyle = '#d4af37'; g.lineWidth = 3; g.strokeRect(x + 1.5, y + 1.5, CARD.w - 3, CARD.h - 3);
      if (c.kind === 'heal') {
        text(g, 'ちゃんこ', x + 20, y + 30, 20, '#ff9a5c', '#000', 'left');
        text(g, '体力を全回復し 小判を50枚', x + 20, y + 62, 13, '#cfd6ff', '#000', 'left', false);
        return;
      }
      if (c.kind === 'evo') {
        const ev = EVO[c.id], d0 = WEAPONS[c.id];
        g.fillStyle = 'rgba(255,120,40,.18)'; g.fillRect(x, y, CARD.w, CARD.h);
        g.strokeStyle = '#ff7a2a'; g.lineWidth = 3; g.strokeRect(x + 1.5, y + 1.5, CARD.w - 3, CARD.h - 3);
        iconBox(g, x + 12, y + 20, 52, ev.icon, d0.color, 0, false, true);
        text(g, ev.name, x + 78, y + 24, 19, '#ffb070', '#000', 'left');
        text(g, '進化！', x + CARD.w - 14, y + 24, 13, '#ff8a3c', '#000', 'right');
        text(g, ev.desc, x + 78, y + 56, 12, '#ffe0c0', '#000', 'left', false);
        text(g, d0.name + ' Lv最大 + ' + PASSIVES[ev.pas].name, x + 78, y + 76, 11, '#c9a98a', '#000', 'left', false);
        return;
      }
      const d = (c.kind === 'w' ? WEAPONS : PASSIVES)[c.id];
      iconBox(g, x + 12, y + 20, 52, d.icon, d.color, 0, false);
      text(g, d.name, x + 78, y + 24, 19, '#fff', '#000', 'left');
      text(g, c.lv === 1 ? (c.kind === 'w' ? '新しい技' : '新しい持ち物') : `Lv ${c.lv - 1} → ${c.lv}`, x + CARD.w - 14, y + 24, 12, c.lv === 1 ? '#7aff9a' : '#ffd24a', '#000', 'right');
      const desc = c.lv === 1 ? d.desc : (c.kind === 'w' ? d.lv[c.lv] : d.desc);
      text(g, desc, x + 78, y + 56, 13, '#cfd6ff', '#000', 'left', false);
      const pips = (d.max || 5);
      for (let k = 0; k < pips; k++) { g.fillStyle = k < c.lv ? '#ffd24a' : '#2a3050'; g.fillRect(x + 78 + k * 12, y + 74, 9, 6); }
    });
  }

  // 音のオン・オフのマーク（「どすこい！はなりきし」と同じ形。オフは×で、うすくする）
  function drawSoundIcon(g, cx, cy, size, on, color) {
    const k = size / 40;
    g.save(); g.translate(cx - size / 2, cy - size / 2); g.scale(k, k);
    g.globalAlpha *= on ? 1 : 0.45; g.fillStyle = color; g.strokeStyle = color; g.lineWidth = 2.6; g.lineCap = 'round';
    g.fill(new Path2D('M6 15h7l9-8v26l-9-8H6z'));
    g.stroke(new Path2D(on ? 'M27 13a9 9 0 0 1 0 14M31 9a14 14 0 0 1 0 22' : 'M27 14l10 12M37 14 27 26'));
    g.restore();
  }

  function draw() {
    const g = ctx;
    g.imageSmoothingEnabled = false;
    g.save();
    if (shake > 0) g.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
    drawWorld(g);
    g.restore();
    // 暗がり（本家のように少し暗く）
    drawHud(g);
    drawJoy(g);

    if (banner) {
      g.globalAlpha = Math.min(1, banner.t * 2);
      text(g, banner.text, W / 2, 120, 26, banner.color, '#000');
      g.globalAlpha = 1;
    }
    if (P.hp / P.maxHp < 0.3 && state === 'play') { g.fillStyle = `rgba(200,0,0,${0.08 + 0.06 * Math.sin(performance.now() / 150)})`; g.fillRect(0, 0, W, H); }

    if (state === 'title') {
      g.fillStyle = 'rgba(0,10,0,.6)'; g.fillRect(0, 0, W, H);
      g.drawImage(IMG.home, W / 2 - 80, 150, 160, 160);
      text(g, 'はなりきし', W / 2, 345, 36, '#ffd24a', '#3a1a00');
      text(g, 'サバイバーズ', W / 2, 388, 30, '#fff', '#3a1a00');
      text(g, 'ドラッグで 動く ・ 攻撃は 自動', W / 2, 450, 15, '#fff', '#000');
      text(g, `30分 生きのびて 横綱を めざせ！`, W / 2, 478, 15, '#cfd6ff', '#000');
      text(g, `ベスト ${fmt(best.time)}  撃破 ${best.kills}`, W / 2, 520, 14, '#ffe27a', '#000');
      text(g, 'タップで はじめる', W / 2, 580, 22, '#9dffb0', '#000');
    }
    if (state === 'levelup') drawLevelUp(g);
    if (state === 'pause') {
      g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, 0, W, H);
      text(g, 'ポーズ', W / 2, 300, 34, '#fff', '#000');
      text(g, 'タップで つづける', W / 2, 360, 18, '#9dffb0', '#000');
    }
    if (state === 'over' || state === 'win') {
      const a = Math.min(1, over.t / 0.6);
      g.fillStyle = `rgba(10,0,0,${(state === 'win' ? 0.4 : 0.65) * a})`; g.fillRect(0, 0, W, H);
      g.globalAlpha = a;
      g.drawImage(IMG.home, W / 2 - 90, 120, 180, 180);
      text(g, state === 'win' ? '横綱昇進！' : '引退…', W / 2, 335, 40, state === 'win' ? '#ffd24a' : '#ff8a7a', '#000');
      text(g, `生き残り ${fmt(gt)}`, W / 2, 385, 22, '#fff', '#000');
      text(g, `撃破 ${kills}   LV ${level}  ${RANKS[rankOf(gt)].name}`, W / 2, 420, 16, '#fff', '#000');
      text(g, `ベスト ${fmt(best.time)}   小判 ${coins}`, W / 2, 452, 14, '#ffe27a', '#000');
      if (over.t > 0.8) text(g, 'タップで もういちど', W / 2, 520, 22, '#9dffb0', '#000');
      g.globalAlpha = 1;
    }
  }

  // ================= 入力・ループ =================
  const toCanvas = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
  function startGame() { state = 'play'; ac(); }

  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); ac();
    const [x, y] = toCanvas(e);
    if (state === 'title') { startGame(); return; }
    if (state === 'over' || state === 'win') { if (over.t > 0.8) { reset(); state = 'play'; } return; }
    if (state === 'pause') { state = 'play'; return; }
    if (state === 'levelup') {
      choices.forEach((c, i) => {
        const cy = CARD.y0 + i * (CARD.h + CARD.gap);
        if (x >= CARD.x && x <= CARD.x + CARD.w && y >= cy && y <= cy + CARD.h) applyChoice(c);
      });
      return;
    }
    if (y > 56 && y < 84 && x > W - 62) {
      if (x > W - 34) { muted = !muted; try { localStorage.setItem('sumo-surv-mute', muted ? '1' : '0'); } catch {} }
      else state = 'pause';
      return;
    }
    cv.setPointerCapture(e.pointerId);
    joy = { id: e.pointerId, ox: x, oy: y, dx: 0, dy: 0 };
  });
  cv.addEventListener('pointermove', e => {
    if (!joy || e.pointerId !== joy.id) return;
    const [x, y] = toCanvas(e);
    let dx = x - joy.ox, dy = y - joy.oy; const d = Math.hypot(dx, dy);
    if (d > 46) { joy.ox += dx / d * (d - 46); joy.oy += dy / d * (d - 46); dx = x - joy.ox; dy = y - joy.oy; }
    const m = Math.min(1, Math.hypot(dx, dy) / 40);
    const dd = Math.hypot(dx, dy) || 1;
    joy.dx = dx / dd * m; joy.dy = dy / dd * m;
  });
  const endJoy = e => { if (joy && e.pointerId === joy.id) joy = null; };
  cv.addEventListener('pointerup', endJoy); cv.addEventListener('pointercancel', endJoy);
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    if (e.code === 'Space' || e.code === 'Enter') {
      if (state === 'title') startGame();
      else if (state === 'over' || state === 'win') { if (over.t > 0.8) { reset(); state = 'play'; } }
      else if (state === 'levelup') applyChoice(choices[0]);
    }
    if (state === 'levelup' && ['Digit1', 'Digit2', 'Digit3'].includes(e.code)) { const c = choices[+e.code.slice(5) - 1]; if (c) applyChoice(c); }
    if (e.code === 'KeyP' && (state === 'play' || state === 'pause')) state = state === 'play' ? 'pause' : 'play';
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('blur', () => { keys = {}; if (state === 'play') state = 'pause'; });

  let last = 0;
  function frame(t) {
    toList.hidden = !(state === 'title' || state === 'over' || state === 'win' || state === 'pause');
    HanaShare.update(state === 'over' || state === 'win', `はなりきしサバイバーズで ${state === 'win' ? '生き残った！' : fmt(gt) + ' 生き残り、'}撃破${kills}体！`);
    HanaRank.update(state === 'over' || state === 'win', level, state === 'title');   // ランキングは「レベル」
    const raw = (t - last) / 1000 || 0;
    const dt = Math.min(0.033, raw);
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // 戻る操作（スワイプ・戻るボタン）: 本番中はポーズ。ふだんは前のページへ
  HanaBack.init({ isPlaying: () => state === 'play' });
  loadImages().then(() => {
    buildPixelSprites();
    buildTile();
    buildSumoSprites();
    reset();
    requestAnimationFrame(frame);
  }).catch(err => { document.body.textContent = err.message; });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
