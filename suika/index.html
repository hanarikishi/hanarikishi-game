<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>はなりきし出世</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="はなりきしゲームズ">
<meta property="og:title" content="はなりきし出世">
<meta property="og:description" content="同じ力士をぶつけて合体、横綱を目指すパズル">
<meta property="og:url" content="https://hanarikishi.github.io/hanarikishi-game/suika/">
<meta property="og:image" content="https://hanarikishi.github.io/hanarikishi-game/thumbs/suika.jpg">
<meta name="twitter:card" content="summary">
<meta name="description" content="同じ力士をぶつけて合体、横綱を目指すパズル">
<link rel="icon" href="../parts/icon-192.png">
<link rel="apple-touch-icon" href="../parts/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6e7b8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #f6e7b8;
    --ink: #3a2a10;
    --panel: #fff8dc;
    --accent: #1f5c00;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: #e9d79c;
    color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  /* スマホ画面の縦長アプリ。PCでは中央に細長く表示 */
  #app {
    height: 100dvh; max-width: 520px; margin: 0 auto; background: var(--bg);
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-shadow: 0 0 30px rgba(60, 40, 0, .3);
  }
  #hud { display: flex; align-items: stretch; gap: 6px; padding: 6px 10px; }
  .stat {
    flex: 1; min-width: 0; background: var(--panel); border: 2px solid var(--ink); border-radius: 12px;
    padding: 3px 8px 4px; display: flex; flex-direction: column; justify-content: center;
  }
  .stat h2 { margin: 0; font-size: 10px; letter-spacing: .1em; opacity: .75; }
  .num { font-size: 20px; font-weight: bold; font-variant-numeric: tabular-nums; line-height: 1.15; white-space: nowrap; }
  .num.sm { font-size: 15px; line-height: 1.5; }
  #nextBox { flex: 0 0 62px; align-items: center; padding: 2px; }
  #next { width: 44px; height: 44px; display: block; }
  #restart {
    flex: 0 0 44px; border: 2px solid var(--ink); border-radius: 12px; background: var(--accent); color: #fff;
    font: inherit; font-size: 20px; cursor: pointer;
  }
  #restart:active { transform: scale(.94); }
  #stage { position: relative; flex: 1; min-height: 0; container-type: size; display: flex; justify-content: center; align-items: center; padding: 0 10px; }
  canvas#game {
    display: block; width: min(100cqw, 60cqh); aspect-ratio: 420 / 700; height: auto;
    border-radius: 14px; box-shadow: 0 4px 14px rgba(60, 40, 0, .35);
    touch-action: none; cursor: pointer;
  }
  #chain {
    display: flex; gap: 4px; overflow-x: auto; padding: 8px 10px 0; touch-action: pan-x;
    scrollbar-width: none;
  }
  #chain::-webkit-scrollbar { display: none; }
  #chain div { flex: 0 0 46px; text-align: center; font-size: 10px; line-height: 1.1; transition: opacity .3s; }
  #chain div.dim { opacity: .3; }
  #chain div.cur { font-weight: bold; }
  #chain canvas { width: 40px; height: 40px; display: block; margin: 0 auto 1px; }
  button { font: inherit; }
  #overlay {
    position: absolute; inset: 0 10px; display: none; flex-direction: column;
    justify-content: center; align-items: center; gap: 10px;
    background: rgba(246, 231, 184, .92); border-radius: 14px; text-align: center; padding: 16px;
  }
  #overlay.show { display: flex; }
  #overlay img { width: min(150px, 30cqh); }
  #overlay h1 { margin: 0; font-size: 30px; }
  #overlay p { margin: 0; font-size: 15px; line-height: 1.6; }
  #ovBtn {
    margin-top: 6px; font-weight: bold; font-size: 18px; padding: 12px 34px; border-radius: 999px;
    border: 3px solid var(--ink); background: var(--accent); color: #fff; cursor: pointer;
  }
  #ovBtn:active { transform: translateY(1px); }
  #ovShare { font-weight: bold; font-size: 15px; padding: 8px 22px; border-radius: 999px; border: 3px solid var(--ink); background: #111; color: #fff; cursor: pointer; }
  #ovShare[hidden] { display: none; }
  #ovRank { font-weight: bold; font-size: 15px; padding: 8px 22px; border-radius: 999px; border: 3px solid var(--ink); background: #ffd24a; color: var(--ink); cursor: pointer; }
  #ovRank[hidden] { display: none; }
  #toList { margin-top: 4px; color: var(--ink); font-weight: bold; font-size: 15px; }
</style>
</head>
<body>
<div id="app">
  <div id="chain" aria-label="番付"></div>
  <div id="hud">
    <div class="stat"><h2>スコア</h2><div class="num" id="score">0</div></div>
    <div class="stat"><h2>最高位</h2><div class="num sm" id="top">前相撲</div></div>
    <div class="stat"><h2>ベスト</h2><div class="num" id="best">0</div></div>
    <div class="stat" id="nextBox"><h2>次</h2><canvas id="next" width="88" height="88"></canvas></div>
    <button id="restart" aria-label="やり直す">↻</button>
  </div>
  <div id="stage">
    <canvas id="game" width="840" height="1400"></canvas>
    <div id="overlay">
      <img id="ovImg" src="../parts/home.png" alt="">
      <h1 id="ovTitle">はなりきし出世</h1>
      <p id="ovText">同じ力士をぶつけて番付を上げよう！<br>横綱を目指せ</p>
      <button id="ovBtn">はじめる</button>
      <button id="ovShare" hidden>𝕏 でシェア</button>
      <button id="ovRank" hidden>🏆 ランキング</button>
      <a id="toList" href="../">◀ ゲーム一覧</a>
    </div>
  </div>
</div>

<script src="../share.js"></script>
<script src="../rank.js"></script>
<script src="../firebase-config.js"></script>
<script src="matter.min.js"></script>
<script>
(() => {
  'use strict';
  const { Engine, World, Bodies, Body, Events } = Matter;

  // ---------- 定義 ----------
  const RANKS = [
    // name, 半径, 体の色, まわしの色
    { name: '前相撲', r: 13, body: '#f1efe8', belt: '#111111' },
    { name: '序の口', r: 19, body: '#f7e3bd', belt: '#111111' },
    { name: '序二段', r: 24, body: '#bfe4f6', belt: '#111111' },
    { name: '三段目', r: 30, body: '#c9eaa5', belt: '#111111' },
    { name: '幕下', r: 37, body: '#f8cfe0', belt: '#111111' },
    { name: '十両', r: 44, body: '#ffd699', belt: '#e65100' },
    { name: '前頭', r: 53, body: '#dcc4f2', belt: '#6a1b9a' },
    { name: '小結', r: 62, body: '#ffb3a1', belt: '#b71c1c' },
    { name: '関脇', r: 72, body: '#b9e3d3', belt: '#7a4a00' },
    { name: '大関', r: 83, body: '#ff9a3c', belt: '#14507a' },
    { name: '横綱', r: 96, body: '#ffee00', belt: '#1f5c00' },
  ];
  const SCORE = [0, 1, 3, 6, 10, 15, 21, 28, 36, 45, 55];
  const WEIGHTS = [30, 27, 22, 14, 7]; // 落とす力士の出やすさ（前相撲〜幕下）
  const MAX = RANKS.length - 1;
  const DROP_MAX = 4; // 落とせるのは前相撲〜幕下まで

  const W = 420, H = 700;
  const WALL = 14;
  const BOX_L = WALL, BOX_R = W - WALL, BOX_B = H - WALL;
  const LINE_Y = 120;      // ゲームオーバーライン
  const DROPPER_Y = 62;    // 持っている力士の高さ

  // ---------- 画像 ----------
  const SRC = ['body_color', 'mawashi', 'body_line', 'normal', 'collision', 'win', 'home'];
  const IMG = {};
  const CX = 513, CY = 538, BODY_R = 395; // 画像上の体の中心と半径

  function loadImages() {
    return Promise.all(SRC.map(n => new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => { IMG[n] = i; res(); };
      i.onerror = () => rej(new Error('画像を読み込めません: ' + n));
      i.src = `../parts/${n}.png`;
    })));
  }

  function tint(img, color) {
    const c = document.createElement('canvas');
    c.width = c.height = 1024;
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = color;
    g.fillRect(0, 0, 1024, 1024);
    return c;
  }

  // sprites[level][face] : face = 'normal' | 'hit' | 'win'
  const DPR = 2;
  const sprites = [];
  function buildSprites() {
    RANKS.forEach((rk, lv) => {
      const scale = rk.r / BODY_R * DPR;
      const size = Math.ceil(1024 * scale);
      const bodyT = tint(IMG.body_color, rk.body);
      const beltT = tint(IMG.mawashi, rk.belt);
      const faces = {};
      for (const face of ['normal', 'hit', 'win']) {
        const c = document.createElement('canvas');
        c.width = c.height = size;
        const g = c.getContext('2d');
        g.imageSmoothingQuality = 'high';
        const d = (im) => g.drawImage(im, 0, 0, size, size);
        d(bodyT); d(beltT); d(IMG.body_line);
        if (face === 'normal') d(IMG.normal);
        else if (face === 'hit') d(IMG.collision);
        else d(IMG.win);
        faces[face] = c;
      }
      sprites.push({ faces, scale: scale / DPR });
    });
  }

  function drawSprite(g, lv, face, x, y, angle, k = 1) {
    const s = sprites[lv];
    const cv = s.faces[face];
    const w = cv.width / DPR * k;
    g.save();
    g.translate(x, y);
    g.rotate(angle);
    g.drawImage(cv, -CX * s.scale * k, -CY * s.scale * k, w, w);
    g.restore();
  }

  // ---------- ゲーム状態 ----------
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  ctx.scale(cv.width / W, cv.height / H);
  const nextCv = document.getElementById('next');
  const nctx = nextCv.getContext('2d');

  let topLv = 0, engine, world, bodies, state, score, best, curLv, nextLv, curX, canDrop, time, particles, shake;
  try { best = +localStorage.getItem('sumo-suika-best') || 0; } catch { best = 0; }

  const $ = id => document.getElementById(id);
  function pickLv() {
    let v = Math.random() * WEIGHTS.reduce((a, b) => a + b);
    for (let i = 0; i < WEIGHTS.length; i++) { v -= WEIGHTS[i]; if (v < 0) return i; }
    return 0;
  }

  function reset() {
    engine = Engine.create({ gravity: { x: 0, y: 0.95 }, positionIterations: 8, velocityIterations: 6 });
    world = engine.world;
    bodies = [];
    particles = [];
    const wall = (x, y, w, h) => Bodies.rectangle(x, y, w, h, { isStatic: true, friction: 0.3, restitution: 0 });
    World.add(world, [
      wall(W / 2, BOX_B + 50, W + 200, 100),
      wall(BOX_L - 50, H / 2, 100, H * 3),
      wall(BOX_R + 50, H / 2, 100, H * 3),
    ]);
    score = 0; time = 0; shake = 0;
    curX = W / 2;
    curLv = 0; nextLv = pickLv(); topLv = 0; // 最初の1個は前相撲
    canDrop = true; state = 'play';
    updateHud();
    Events.on(engine, 'collisionStart', onCollide);
  }

  const mergeQueue = [];
  function onCollide(ev) {
    for (const p of ev.pairs) {
      const a = p.bodyA, b = p.bodyB;
      if (a.lv === undefined || b.lv === undefined) continue;
      // 勢いよくぶつかったら「ぐっ」の顔
      const rel = Math.hypot(a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y);
      if (rel > 4) { a.hitT = b.hitT = 0.35; }
      if (a.lv !== b.lv || a.merging || b.merging) continue;
      a.merging = b.merging = true;
      mergeQueue.push([a, b]);
    }
  }

  function addSumo(lv, x, y, vy = 0) {
    const r = RANKS[lv].r;
    const b = Bodies.circle(x, y, r, {
      restitution: 0.08, friction: 0.5, frictionStatic: 0.8, frictionAir: 0.02,
      density: 0.0015,
    });
    b.lv = lv; b.age = 0; b.over = 0; b.hitT = 0; b.winT = 0; b.pop = 0;
    Body.setVelocity(b, { x: 0, y: vy });
    World.add(world, b);
    bodies.push(b);
    return b;
  }

  function removeSumo(b) {
    World.remove(world, b);
    const i = bodies.indexOf(b);
    if (i >= 0) bodies.splice(i, 1);
  }

  function burst(x, y, color, n, power) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = (0.5 + Math.random()) * power;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 1, color, size: 2 + Math.random() * 4 });
    }
  }

  function processMerges() {
    while (mergeQueue.length) {
      const [a, b] = mergeQueue.shift();
      if (!bodies.includes(a) || !bodies.includes(b)) continue;
      const lv = a.lv;
      const x = (a.position.x + b.position.x) / 2, y = (a.position.y + b.position.y) / 2;
      removeSumo(a); removeSumo(b);
      if (lv >= MAX) {
        // 横綱同士：ご当地大入り！
        score += 100;
        burst(x, y, '#ffee00', 60, 7);
        burst(x, y, '#1f5c00', 40, 6);
        shake = 14;
        continue;
      }
      topLv = Math.max(topLv, lv + 1);
      const n = addSumo(lv + 1, x, y);
      const newer = a.age <= b.age ? a : b; // 後から落とした（新しい）ほうの向きを引き継ぐ
      Body.setAngle(n, newer.angle);
      n.age = 1; n.pop = 1; n.winT = 0.9;
      score += SCORE[lv + 1];
      burst(x, y, RANKS[lv + 1].belt, 16 + lv * 3, 3 + lv * 0.4);
      if (lv + 1 === MAX) { shake = 10; burst(x, y, '#ffee00', 50, 6); }
    }
    if (score > best) {
      best = score;
      try { localStorage.setItem('sumo-suika-best', best); } catch {}
    }
    updateHud();
  }

  function updateHud() {
    $('score').textContent = score;
    $('best').textContent = best;
    $('top').textContent = RANKS[topLv].name;
    [...$('chain').children].forEach((d, i) => {
      d.classList.toggle('dim', i > topLv);
      d.classList.toggle('cur', i === topLv);
    });
    nctx.clearRect(0, 0, 88, 88);
    const r = RANKS[nextLv].r;
    const k = 26 / r;
    // ミニキャンバスに収まるよう縮小描画
    nctx.save();
    nctx.scale(88 / 64, 88 / 64);
    drawSprite(nctx, nextLv, 'normal', 32, 32, 0, k);
    nctx.restore();
  }

  function buildChain() {
    const box = $('chain');
    RANKS.forEach((rk, lv) => {
      const d = document.createElement('div');
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      const g = c.getContext('2d');
      const k = 24 / rk.r;
      g.save(); g.scale(1, 1);
      drawSprite(g, lv, 'normal', 32, 32, 0, k);
      g.restore();
      d.appendChild(c);
      d.appendChild(document.createTextNode(rk.name));
      box.appendChild(d);
    });
  }

  // ---------- 操作 ----------
  function toGameX(e) {
    const rect = cv.getBoundingClientRect();
    return (e.clientX - rect.left) / rect.width * W;
  }
  function clampX(x) {
    const r = RANKS[curLv].r;
    return Math.max(BOX_L + r + 1, Math.min(BOX_R - r - 1, x));
  }
  function drop() {
    if (state !== 'play' || !canDrop) return;
    canDrop = false;
    addSumo(curLv, clampX(curX), DROPPER_Y, 2);
    curLv = nextLv; nextLv = pickLv();
    updateHud();
    setTimeout(() => { canDrop = true; }, 550);
  }
  cv.addEventListener('pointerdown', e => { curX = toGameX(e); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { curX = toGameX(e); });
  cv.addEventListener('pointerup', e => { curX = toGameX(e); drop(); });
  window.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft') curX -= 14;
    else if (e.code === 'ArrowRight') curX += 14;
    else if (e.code === 'Space' || e.code === 'ArrowDown') { e.preventDefault(); drop(); }
    else if (e.code === 'KeyR') start();
  });

  // ---------- 描画 ----------
  function draw() {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

    // 背景（土俵っぽい）
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#fdf3d0'); bg.addColorStop(1, '#e9c986');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // 箱の中
    ctx.fillStyle = 'rgba(255, 250, 230, .55)';
    ctx.fillRect(BOX_L, LINE_Y - 10, BOX_R - BOX_L, BOX_B - LINE_Y + 10);
    // 俵
    ctx.fillStyle = '#c9a15a';
    ctx.fillRect(0, BOX_B, W, WALL);
    ctx.fillStyle = '#8a6a2c';
    ctx.fillRect(0, 0, BOX_L, H);
    ctx.fillRect(BOX_R, 0, WALL, H);
    ctx.fillRect(0, BOX_B, W, WALL);
    ctx.strokeStyle = '#5a4416'; ctx.lineWidth = 3;
    ctx.strokeRect(BOX_L, LINE_Y - 10, BOX_R - BOX_L, BOX_B - LINE_Y + 10);

    // ゲームオーバーライン
    const danger = bodies.some(b => b.over > 0.3);
    ctx.setLineDash([10, 8]);
    ctx.strokeStyle = danger && Math.floor(time * 6) % 2 ? '#e00' : 'rgba(200,40,40,.7)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(BOX_L, LINE_Y); ctx.lineTo(BOX_R, LINE_Y); ctx.stroke();
    ctx.setLineDash([]);

    // 力士
    for (const b of bodies) {
      const k = 1 + Math.sin(Math.min(1, 1 - b.pop) * Math.PI) * 0.0 + b.pop * 0.25 * Math.sin(b.pop * Math.PI * 2);
      const face = b.winT > 0 || b.lv === MAX ? 'win' : b.hitT > 0 ? 'hit' : 'normal';
      drawSprite(ctx, b.lv, face, b.position.x, b.position.y, b.angle, k);
    }

    // 持っている力士 + ガイド
    if (state === 'play') {
      const x = clampX(curX);
      ctx.strokeStyle = 'rgba(80,60,20,.25)'; ctx.lineWidth = 2; ctx.setLineDash([4, 6]);
      ctx.beginPath(); ctx.moveTo(x, DROPPER_Y); ctx.lineTo(x, BOX_B); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = canDrop ? 1 : 0.35;
      drawSprite(ctx, curLv, 'normal', x, DROPPER_Y, 0);
      ctx.globalAlpha = 1;
    }

    // パーティクル
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ---------- ループ ----------
  let last = 0, acc = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (t - last) / 1000 || 0); last = t;
    if (state === 'play') {
      acc += dt;
      while (acc >= 1 / 60) {
        Engine.update(engine, 1000 / 60);
        for (const b of bodies) Body.setAngularVelocity(b, b.angularVelocity * 0.85); // 原作のようにあまり転がらない
        acc -= 1 / 60;
        processMerges();
      }
      time += dt;
      for (const b of bodies) {
        b.age += dt;
        b.hitT = Math.max(0, b.hitT - dt);
        b.winT = Math.max(0, b.winT - dt);
        b.pop = Math.max(0, b.pop - dt * 4);
        const top = b.position.y - RANKS[b.lv].r;
        if (b.age > 1.5 && top < LINE_Y && b.speed < 1.2) b.over += dt; else b.over = 0;
        if (b.over > 2) { gameOver(); break; }
      }
    }
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.022; }
    particles = particles.filter(p => p.life > 0);
    shake = Math.max(0, shake - 0.6);
    draw();
  }

  // ---------- 画面遷移 ----------
  const ov = $('overlay');
  function showOverlay(title, text, btn, win) {
    $('ovTitle').textContent = title;
    $('ovText').innerHTML = text;
    $('ovBtn').textContent = btn;
    $('ovImg').src = win ? '../parts/home.png' : '../parts/home.png';
    $('ovShare').hidden = state !== 'over'; $('ovRank').hidden = state !== 'over' && state !== 'title';
    ov.classList.add('show');
  }
  function gameOver() {
    state = 'over';
    const top = topLv;
    HanaRank.submit(score);
    showOverlay('取組終了！', `最高位：<b>${RANKS[top].name}</b><br>スコア：<b>${score}</b>`, 'もう一番');
  }
  function start() { ov.classList.remove('show'); reset(); }
  $('ovRank').onclick = () => HanaRank.open();
  $('ovShare').onclick = () => HanaShare.open(`はなりきし出世で ${RANKS[topLv].name} まで出世！ スコア${score}`);
  $('ovBtn').onclick = start;
  $('restart').onclick = start;

  // ---------- 起動 ----------
  loadImages().then(() => {
    buildSprites();
    buildChain();
    reset();
    state = 'title';
    showOverlay('はなりきし出世', '同じ力士をぶつけて番付を上げよう！<br>前相撲 → … → <b>横綱</b>', 'はじめる');
    $('best').textContent = best;
    requestAnimationFrame(frame);
  }).catch(err => {
    document.body.insertAdjacentHTML('afterbegin', `<p style="color:#b00">${err.message}</p>`);
  });
})();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
