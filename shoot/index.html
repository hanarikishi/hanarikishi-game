<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: #1c2433; display: flex; justify-content: center; align-items: center;
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  /* 横画面のゲーム（700x420） */
  canvas {
    display: block; width: 100vw; height: 100dvh; touch-action: none; cursor: pointer;
  }
  /* ゲーム一覧へ戻るボタン（遊んでいないときだけ、画面の左下に出す） */
  #toList {
    position: fixed; z-index: 5; text-decoration: none;
    left: calc(env(safe-area-inset-left, 0px) + 10px); bottom: 10px;
    padding: 6px 14px; border-radius: 999px; border: 2px solid #3a2a10;
    background: rgba(255, 248, 220, .94); color: #3a2a10; font-weight: bold; font-size: 14px;
  }
  #toList[hidden] { display: none; }
  /* シェアとランキングのボタンは、横画面なので 画面の右はしに寄せる（ゲームの中のボタンと かさならないように） */
  #shareX { left: auto !important; right: calc(env(safe-area-inset-right, 0px) + 10px) !important; bottom: 10px !important; }
  #hrBtn { left: auto !important; right: calc(env(safe-area-inset-right, 0px) + 10px) !important; bottom: 52px !important; }
  /* スマホを縦に持っているときは、横にしてもらう */
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 10; background: #0a0f24; color: #fff8dc;
    flex-direction: column; justify-content: center; align-items: center; gap: 16px; font-weight: bold; font-size: 20px; text-align: center;
  }
  #rotate .phone { font-size: 64px; animation: turn 1.6s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game" width="1400" height="840"></canvas>
<a id="toList" href="../">◀ ゲーム一覧</a>
<div id="rotate"><div class="phone">📱</div><div>スマホを横にしてね</div></div>
<script src="../back.js"></script>
<script src="../share.js"></script>
<script src="../rank.js"></script>
<script src="../firebase-config.js"></script>
<script src="core.js"></script>
<script src="stages.js"></script>
<script>
(() => {
  'use strict';
  const toList = document.getElementById('toList');
  const S = window.SHOOT, C = S.C, STAGES = window.SHOOT_STAGES, CHAPTERS = window.SHOOT_CHAPTERS, PER = window.SHOOT_PER || 10;   // 1章あたりの面数
  const W = C.W, H = C.H, FLOOR = C.FLOOR, BALL_R = C.BALL_R, RIM_HALF = C.RIM_HALF;
  const BEST_KEY = 'sumo-shoot-best';            // エンドレスの最高点（一覧ページに出す）
  const STAGE_KEY = 'sumo-shoot-stages2';         // ステージごとの★

  // はなりきしは、最初から横綱の姿（黄色い体に緑のまわし）
  const YOKO = { body: '#ffee00', belt: '#1f5c00' };

  // ---- 画像（はなりきしの絵は ../parts/ に共通で置いてある） ----
  const SRC = ['body_color', 'mawashi', 'body_line', 'normal', 'collision', 'win', 'home', 'basketball/basket1', 'basketball/basket2', 'basketball/basket3', 'basketball/basket4'];   // basketball/ は、シュートのポーズの絵（640x640・右向き・透明）
  const IMG = {};
  const CX = 513, CY = 538, BODY_R = 395;
  const loadImages = () => Promise.all(SRC.map(n => new Promise((res, rej) => {
    const i = new Image(); i.onload = () => { IMG[n] = i; res(); }; i.onerror = () => rej(new Error('画像を読み込めません: ' + n)); i.src = `../parts/${n}.png`;
  })));
  const tint = (img, color) => {
    const c = document.createElement('canvas'); c.width = c.height = 1024;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0);
    g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, 1024, 1024); return c;
  };
  const SPR_R = 30, DPR = 2, spriteCache = {};
  function sprite(body, belt) {
    const key = body + belt;
    if (spriteCache[key]) return spriteCache[key];
    const size = Math.ceil(1024 * SPR_R / BODY_R * DPR);
    const bodyT = tint(IMG.body_color, body), beltT = tint(IMG.mawashi, belt), faces = {};
    for (const face of ['normal', 'hit', 'win']) {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const g = c.getContext('2d'); g.imageSmoothingQuality = 'high';
      const d = im => g.drawImage(im, 0, 0, size, size);
      d(bodyT); d(beltT); d(IMG.body_line); d(face === 'normal' ? IMG.normal : face === 'hit' ? IMG.collision : IMG.win);
      faces[face] = c;
    }
    return (spriteCache[key] = faces);
  }
  function drawSumo(g, faces, face, x, y, r) {
    const k = r / BODY_R;
    g.drawImage(faces[face], x - CX * k, y - CY * k, 1024 * k, 1024 * k);
  }

  // ---- 効果音（ブラウザの中で合成） ----
  let actx = null, muted = false;
  try { muted = localStorage.getItem('sumo-shoot-mute') === '1'; } catch {}
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { actx = null; } }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, dur, type = 'sine', vol = 0.15, slide = 0, delay = 0) {
    const a = audio(); if (!a || muted) return;
    const o = a.createOscillator(), gn = a.createGain(), t0 = a.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t0 + dur);
    gn.gain.setValueAtTime(vol, t0); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gn).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(dur, vol = 0.08, freq = 1200, q = 1) {
    const a = audio(); if (!a || muted) return;
    const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), gn = a.createGain();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; gn.gain.value = vol;
    s.buffer = buf; s.connect(f).connect(gn).connect(a.destination); s.start();
  }
  const SFX = {
    pull: () => tone(300, 0.05, 'triangle', 0.05),
    throw: () => { noise(0.18, 0.08, 900); tone(220, 0.12, 'sine', 0.1, 1.8); },
    floor: v => tone(110, 0.12, 'sine', Math.min(0.3, 0.06 + v * 0.0003), 0.7),
    rim: v => { tone(880, 0.18, 'square', Math.min(0.08, 0.02 + v * 0.00008), 0.9); tone(1320, 0.12, 'triangle', 0.05); },
    board: v => { tone(160, 0.1, 'square', Math.min(0.1, 0.03 + v * 0.0001), 0.8); noise(0.06, 0.06, 400); },
    wall: v => { tone(200, 0.08, 'triangle', Math.min(0.12, 0.03 + v * 0.0001), 0.7); noise(0.05, 0.05, 700); },
    zabuton: () => tone(300, 0.25, 'sine', 0.18, 2.2),
    swish: () => noise(0.35, 0.16, 3000, 0.7),
    score: k => { tone(660, 0.12, 'triangle', 0.16); tone(880, 0.18, 'triangle', 0.16, 1, 0.08); if (k) tone(1175, 0.25, 'triangle', 0.16, 1, 0.16); noise(0.6, 0.08, 500); },
    miss: () => tone(300, 0.25, 'sawtooth', 0.06, 0.6),
    star: k => tone(880 + k * 220, 0.18, 'triangle', 0.16),
    rankup: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'triangle', 0.15, 1, i * 0.1)); },
    over: () => { tone(392, 0.3, 'triangle', 0.12, 1); tone(330, 0.3, 'triangle', 0.12, 1, 0.25); tone(262, 0.5, 'triangle', 0.12, 1, 0.5); },
    tap: () => tone(700, 0.05, 'triangle', 0.08),
  };

  // ---- 進み具合 ----
  let progress = {};
  try { progress = JSON.parse(localStorage.getItem(STAGE_KEY)) || {}; } catch {}
  let best = 0;
  try { best = +localStorage.getItem(BEST_KEY) || 0; } catch {}
  const totalStars = () => Object.values(progress).reduce((s, v) => s + v, 0);
  const unlocked = i => i === 0 || progress[i - 1] > 0;
  function saveStage(i, st) {
    if ((progress[i] || 0) >= st) return;
    progress[i] = st;
    try { localStorage.setItem(STAGE_KEY, JSON.stringify(progress)); } catch {}
  }

  // ================= 状態 =================
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  // 画面いっぱいに広げる。ゲームの中心の700x420はそのまま、左右（や上下）に背景と地面を足す
  let ox = 0, oy = 0, sc = 1, VW = W, VH = H;
  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight, dpr = Math.min(2.5, window.devicePixelRatio || 1);
    sc = Math.min(vw / W, vh / H); VW = vw / sc; VH = vh / sc; ox = (VW - W) / 2; oy = (VH - H) / 2;
    cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
    ctx.setTransform(sc * dpr, 0, 0, sc * dpr, ox * sc * dpr, oy * sc * dpr);
    C.W = W + ox;                 // ボールが跳ね返る右の壁は、画面の右はし
    bgCanvas = null;
  }
  window.addEventListener('resize', resize);
  // scene: title / select / play / clear / fail / over
  let scene = 'title', mode = 'stage', t = 0, page = 0;
  let stage, stageNo, stageT, balls, shotNo, ball, aim, shot, pops, parts, shake, flash, endT, jumpT, score, streak, starsGot, starShown;

  function playStage(i) {
    mode = 'stage'; stageNo = i; stage = STAGES[i]; balls = 3; shotNo = 0;
    begin();
  }
  function playEndless() {
    mode = 'endless'; score = 0; streak = 0; balls = 3; shotNo = 0;
    stage = endlessStage(0);
    begin();
  }
  function begin() {
    stageT = 0; pops = []; parts = []; shake = 0; flash = 0; endT = 0; jumpT = 0; starShown = 0;
    newBall(); scene = 'play';
  }
  // エンドレスのゴールの置き方（点が増えると、輪が小さく・遠く・高く・動き、天井や杭も出る）。入る打ち方があるものだけを使う
  function endlessStage(n) {
    const far = Math.min(1, n / 40);
    for (let tries = 0; ; tries++) {
      const hx = Math.round(480 + Math.random() * 150), hy = Math.round(130 + Math.random() * (100 + far * 80)), dyy = n >= 12 ? Math.min(70, (n - 10) * 3) : 0;
      const st = { shooter: Math.round(50 + Math.random() * (260 - far * 100)), walls: [], pegs: [],
        ceil: Math.max(30, Math.round(hy - dyy - 200 + far * 120 - Math.random() * 50)),
        hoop: { x: hx, y: hy, board: 'R', rim: Math.round(40 - far * 17),
          dy: dyy, period: n >= 12 ? 3.2 : 0 } };
      if (n >= 8 && Math.random() < 0.6) { const cy = Math.round(st.ceil + 40 + Math.random() * 40); st.walls.push([220, cy, hx - 60, cy, 'w']); }
      if (n >= 16 && Math.random() < 0.7) { const px = 260 + Math.random() * 160, py = 150 + Math.random() * 110, an = (Math.random() - 0.5) * 1.2, l = 50; st.walls.push([Math.round(px - Math.cos(an) * l), Math.round(py - Math.sin(an) * l), Math.round(px + Math.cos(an) * l), Math.round(py + Math.sin(an) * l), 'w']); }
      if (n >= 24) for (let k = 0; k < 3; k++) { const x = 220 + Math.random() * 320, y = 80 + Math.random() * 250; if (Math.hypot(x - hx, y - st.hoop.y) > 70) { const an = Math.random() * Math.PI, l = 16 + Math.random() * 8; st.walls.push([Math.round(x - Math.cos(an) * l), Math.round(y - Math.sin(an) * l), Math.round(x + Math.cos(an) * l), Math.round(y + Math.sin(an) * l), 'w']); } }
      if (tries > 30 || solvable(st)) return st;
    }
  }
  function solvable(st) {
    for (let a = 10; a <= 85; a += 3) for (let sp = 350; sp <= C.MAX_SPEED; sp += 40) {
      const r = a * Math.PI / 180;
      if (S.simulate(st, Math.cos(r) * sp, -Math.sin(r) * sp).scored) return true;
    }
    return false;
  }
  // 狙いの点線をどこまで出すか（先に進むほど短くなり、最後は自分の目で狙う）
  function guideDots() {
        return 99;
  }
  function newBall() {
    const h = S.ballHome(stage);
    ball = { x: h.x, y: h.y, vx: 0, vy: 0, spin: 0, ang: 0, flying: false, trail: [] };
    aim = null; shot = null;
  }

  function shoot(v) {
    const h = S.ballHome(stage);
    ball.x = h.x; ball.y = h.y;          // 構えて揺れていても、ガイドと同じ位置から打つ
    acc = 0;
    ball.vx = v.vx; ball.vy = v.vy; ball.flying = true; ball.spin = v.vx * 0.02;
    shot = { t: 0, touched: false, board: false, scored: false, done: false, restT: 0 };
    jumpT = 0.5; shotNo++;   // 放したあとのジャンプ（0.5秒）
    SFX.throw();
  }

  function onHit(kind, v) {
    if (!shot) return;
    if (kind !== 'floor') shot.touched = true;
    if (kind === 'rim') { SFX.rim(v); hoopSway = Math.min(1, hoopSway + v / 600); if (v > 300) shake = 0.12; }
    else if (kind === 'board') { SFX.board(v); shot.board = true; }
    else if (kind === 'zabuton') SFX.zabuton();
    else if (kind === 'wall' || kind === 'peg') { if (v > 80) SFX.wall(v); }
    else if (kind === 'floor' && v > 120) SFX.floor(v);
  }
  let hoopSway = 0;

  function scored(hp) {
    shot.scored = true; hoopSway = 1;
    SFX.swish(); SFX.score(!shot.touched);
    for (let i = 0; i < 16; i++) { const a = -Math.PI / 2 + (Math.random() - 0.5) * 2, s = 120 + Math.random() * 220; parts.push({ x: hp.x, y: hp.y + 20, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.9, c: ['#ffd54f', '#ff7043', '#ffffff', '#81d4fa'][i % 4] }); }
    const label = !shot.touched ? 'スウィッシュ！' : shot.board ? 'バンク！' : 'ナイス！';
    if (mode === 'endless') {
      streak++;
      const bonus = streak >= 3 ? Math.min(3, Math.floor(streak / 3)) : 0, pts = (shot.touched ? 2 : 3) + bonus;
      score += pts;
      pops.push({ x: hp.x - 40, y: hp.y - 40, text: `+${pts}`, sub: label + (bonus ? `　${streak}連続！` : ''), t: 0 });
      if (score % 10 < pts) { SFX.rankup(); flash = 0.2; confetti(); pops.push({ x: W / 2, y: 120, text: `${score - score % 10}点！`, sub: '', t: 0 }); }
    } else {
      pops.push({ x: hp.x - 40, y: hp.y - 40, text: label, sub: '', t: 0 });
    }
  }
  function confetti() {
    for (let i = 0; i < 40; i++) parts.push({ x: W / 2, y: 120, vx: (Math.random() - 0.5) * 700, vy: -Math.random() * 400, t: 0, life: 1.8, c: ['#ff7043', '#ffd54f', '#4fc3f7', '#ffffff'][i % 4], zab: true, r: Math.random() * 6 });
  }

  function endShot() {
    shot.done = true;
    if (mode === 'stage') {
      if (shot.scored) {
        starsGot = 4 - shotNo; saveStage(stageNo, starsGot);
        confetti(); flash = 0.2;
        setTimeout(() => { scene = 'clear'; endT = 0; }, 500);
        return;
      }
      balls--;
      pops.push({ x: ball.x, y: Math.min(ball.y, FLOOR - 40) - 20, text: 'ミス…', sub: '', t: 0, miss: true }); SFX.miss();
      if (balls <= 0) { setTimeout(() => { scene = 'fail'; endT = 0; SFX.over(); }, 500); return; }
    } else {
      if (shot.scored) { stage = endlessStage(score); stageT = 0; }
      else {
        streak = 0; balls--;
        pops.push({ x: ball.x, y: Math.min(ball.y, FLOOR - 40) - 20, text: 'ミス…', sub: '', t: 0, miss: true }); SFX.miss();
        if (balls <= 0) {
          if (score > best) { best = score; try { localStorage.setItem(BEST_KEY, best); } catch {} }
          setTimeout(() => { scene = 'over'; endT = 0; SFX.over(); }, 500);
          return;
        }
      }
    }
    setTimeout(() => { if (scene === 'play') newBall(); }, 350);
  }

  // ================= 入力 =================
  let buttons = [];
  function pos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / sc - ox, (e.clientY - r.top) / sc - oy]; }
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); audio();
    const [x, y] = pos(e);
    for (let i = buttons.length - 1; i >= 0; i--) { const b = buttons[i]; if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) { SFX.tap(); return b.fn(); } }
    if (scene === 'rules') { scene = 'title'; return; }
    if (scene === 'over') { if (endT > 0.8) playEndless(); return; }
    if (scene === 'play' && ball && !ball.flying && y > 60) { aim = { sx: x, sy: y, x, y }; cv.setPointerCapture(e.pointerId); SFX.pull(); }
  });
  cv.addEventListener('pointermove', e => { if (!aim) return; const [x, y] = pos(e); aim.x = x; aim.y = y; });
  cv.addEventListener('pointerup', () => { if (!aim) return; const v = aimVel(); aim = null; if (v) shoot(v); });
  cv.addEventListener('pointercancel', () => { aim = null; });
  const aimVel = () => aim ? S.aimToVel(aim.sx - aim.x, aim.sy - aim.y) : null;

  // ================= 更新 =================
  let acc = 0;
  function update(dt) {
    t += dt;
    toList.hidden = !(scene === 'title' || scene === 'select' || scene === 'over' || scene === 'rules');
    HanaShare.update(scene === 'over' || (scene === 'clear' && mode === 'stage'), scene === 'over' ? `はなりきしシュートで ${score}点！` : `はなりきしシュートの ${Math.floor(stageNo / PER) + 1}-${stageNo % PER + 1} をクリア！ ★${starsGot}`);
    HanaRank.update(scene === 'over', score, scene === 'title');
    if (scene !== 'play' && scene !== 'clear' && scene !== 'fail' && scene !== 'over') return;
    endT += dt;
    stageT += dt;
    hoopSway = Math.max(0, hoopSway - dt * 1.5);
    jumpT = Math.max(0, jumpT - dt);
    shake = Math.max(0, shake - dt); flash = Math.max(0, flash - dt);
    pops.forEach(p => { p.t += dt; }); pops = pops.filter(p => p.t < 1.2);
    parts.forEach(p => { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 700 * dt; if (p.r !== undefined) p.r += dt * 6; });
    parts = parts.filter(p => p.t < p.life);
    if (scene === 'clear') while (starShown < starsGot && endT >= 0.5 + starShown * 0.25) SFX.star(starShown++);
    if (!ball) return;
    if (!ball.flying) { const h = S.ballHome(stage); ball.x = h.x; ball.y = h.y + Math.sin(t * 4) * 2; return; }
    acc += dt;
    while (acc >= C.DT) {
      acc -= C.DT;
      const py = ball.y;
      const hp = S.step(ball, stage, stageT, onHit);
      if (!shot.scored && S.through(py, ball, hp)) scored(hp);
    }
    ball.ang += ball.spin * dt;
    ball.trail.push([ball.x, ball.y]); if (ball.trail.length > 10) ball.trail.shift();
    shot.t += dt;
    if (Math.hypot(ball.vx, ball.vy) < 60 && ball.y > FLOOR - BALL_R - 2) shot.restT += dt;
    if (!shot.done && (ball.x < -50 || shot.t > (shot.scored ? 0.9 : 5) || shot.restT > 0.4)) endShot();
  }

  // ================= 描画 =================
  function text(g, s, x, y, size, color = '#fff', stroke = 'rgba(0,0,0,.55)', align = 'center') {
    g.font = `bold ${size}px "Hiragino Sans","Yu Gothic","Meiryo",sans-serif`; g.textAlign = align; g.textBaseline = 'middle';
    if (stroke) { g.lineJoin = 'round'; g.lineWidth = size / 4; g.strokeStyle = stroke; g.strokeText(s, x, y); }
    g.fillStyle = color; g.fillText(s, x, y);
  }
  function rrect(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
  let btnDx = 0;
  const shifted = (g, dx, fn) => { g.save(); g.translate(dx, 0); btnDx = dx; fn(); btnDx = 0; g.restore(); };
  function button(g, x, y, w, h, fn, label, color = '#fff8dc', size = 18) {
    rrect(g, x, y + 3, w, h, Math.min(14, h / 2)); g.fillStyle = 'rgba(0,0,0,.35)'; g.fill();
    rrect(g, x, y, w, h, Math.min(14, h / 2)); g.fillStyle = color; g.fill(); g.lineWidth = 2.5; g.strokeStyle = '#3a2a10'; g.stroke();
    if (typeof label === 'function') label(x + w / 2, y + h / 2); else text(g, label, x + w / 2, y + h / 2, size, '#3a2a10', null);
    buttons.push({ x: x + btnDx, y, w, h, fn });
  }
  function star(g, x, y, r, filled) {
    g.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    g.closePath(); g.fillStyle = filled ? '#ffc400' : 'rgba(255,255,255,.18)'; g.fill();
    g.lineWidth = r * 0.14; g.lineJoin = 'round'; g.strokeStyle = filled ? '#b26a00' : 'rgba(255,255,255,.3)'; g.stroke();
  }

  // 背景（屋外のコート。目立たないように、くすんだ空と遠くの丘だけ）。一度だけ描いてとっておく
  let bgCanvas = null;
  function background() {
    if (bgCanvas) return bgCanvas;
    const k = Math.min(2, 3000 / Math.max(VW, VH));
    bgCanvas = document.createElement('canvas'); bgCanvas.width = Math.round(VW * k); bgCanvas.height = Math.round(VH * k);
    const g = bgCanvas.getContext('2d'); g.scale(k, k); g.translate(ox, oy);
    const X0 = -ox, X1 = W + ox, Y0 = -oy, Y1 = H + oy;
    const sky = g.createLinearGradient(0, Y0, 0, FLOOR);
    sky.addColorStop(0, '#6f8aa6'); sky.addColorStop(1, '#bccbd8');
    g.fillStyle = sky; g.fillRect(X0, Y0, X1 - X0, FLOOR - Y0);
    const hill = (c, base, amp, f, ph) => {
      g.fillStyle = c; g.beginPath(); g.moveTo(X0, FLOOR);
      for (let x = X0; x <= X1 + 10; x += 10) g.lineTo(x, base + Math.sin(x * f + ph) * amp + Math.sin(x * f * 2.3 + ph) * amp * 0.4);
      g.lineTo(X1, FLOOR); g.closePath(); g.fill();
    };
    hill('#9fb3c5', 285, 22, 0.008, 1); hill('#8ea5ba', 320, 16, 0.011, 4);
    const fg = g.createLinearGradient(0, FLOOR, 0, Y1);
    fg.addColorStop(0, '#c7a56f'); fg.addColorStop(1, '#a5844f');
    g.fillStyle = fg; g.fillRect(X0, FLOOR, X1 - X0, Y1 - FLOOR);
    g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(X0, FLOOR, X1 - X0, 2);
    g.fillStyle = 'rgba(255,255,255,.5)'; g.fillRect(X0, FLOOR + 18, X1 - X0, 2);
    return bgCanvas;
  }
  const drawBg = g => g.drawImage(background(), -ox, -oy, VW, VH);
  const fullRect = g => g.fillRect(-ox, -oy, VW, VH);

  // 天井（これより上には飛ばせない）
  function drawCeiling(g) {
    if (stage.ceil === undefined) return;
    const c = stage.ceil, grd = g.createLinearGradient(0, 0, 0, c);
    grd.addColorStop(0, 'rgba(18,26,48,.95)'); grd.addColorStop(1, 'rgba(40,56,92,.9)');
    g.fillStyle = grd; g.fillRect(-ox, -oy, VW, c + oy);
    g.fillStyle = '#ffc107'; g.fillRect(-ox, c - 3, VW, 3);
    g.fillStyle = 'rgba(18,26,48,.9)'; for (let x = -ox - 10; x < W + ox; x += 28) { g.beginPath(); g.moveTo(x, c - 3); g.lineTo(x + 14, c - 3); g.lineTo(x + 6, c); g.lineTo(x - 8, c); g.closePath(); g.fill(); }
  }

  function drawWalls(g) {
    g.lineCap = 'round';
    for (const [x1, y1, x2, y2, type] of stage.walls) {
      const line = (c, w, oy = 0) => { g.strokeStyle = c; g.lineWidth = w; g.beginPath(); g.moveTo(x1, y1 + oy); g.lineTo(x2, y2 + oy); g.stroke(); };
      if (type === 'z') {   // トランポリン: 赤い枠・黒いマット・下にバネと脚
        const L = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / L, uy = (y2 - y1) / L;
        g.strokeStyle = '#7d8aa8'; g.lineWidth = 2;
        for (let d = 8; d < L - 4; d += 11) {   // バネ
          const px = x1 + ux * d, py = y1 + uy * d + 6;
          g.beginPath(); g.moveTo(px, py); g.lineTo(px - 3, py + 3); g.lineTo(px + 3, py + 6); g.lineTo(px - 3, py + 9); g.lineTo(px, py + 11); g.stroke();
        }
        for (const [lx, ly] of [[x1, y1], [x2, y2]]) { g.strokeStyle = '#2b3350'; g.lineWidth = 4; g.beginPath(); g.moveTo(lx, ly + 4); g.lineTo(lx, Math.min(C.FLOOR, ly + 16)); g.stroke(); }
        line('#3a0a06', C.WALL_T * 2 + 7); line('#e0402f', C.WALL_T * 2 + 3); line('#1c2038', C.WALL_T * 2 - 3); line('rgba(255,170,150,.9)', 1.6, -C.WALL_T);
      } else {
        line('#121a30', C.WALL_T * 2 + 4); line('#6f86a8', C.WALL_T * 2); line('#c9d8ee', 2, -3);
        g.setLineDash([10, 10]); line('rgba(255,193,7,.8)', 2); g.setLineDash([]);
      }
    }
    for (const [x, y, r] of stage.pegs) {
      g.fillStyle = '#121a30'; g.beginPath(); g.arc(x, y, r + 2, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#6f86a8'; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#c9d8ee'; g.beginPath(); g.arc(x, y - r * 0.3, r * 0.45, Math.PI, 0); g.fill();
    }
  }

  function drawHoop(g, front) {
    const hp = S.hoopAt(stage, stageT), bs = S.boardSeg(stage, hp), { x, y, rim } = hp, L = x - rim, R = x + rim;
    if (!front) {
      if (bs) {
        const bx = bs[0], top = bs[1], bot = bs[3];
        const pole = g.createLinearGradient(bx - 4, 0, bx + 4, 0); pole.addColorStop(0, '#5b6a86'); pole.addColorStop(0.5, '#c4d0e4'); pole.addColorStop(1, '#4a5873');
        g.fillStyle = pole; g.fillRect(bx - 4, bot, 8, FLOOR - bot);
        g.fillStyle = '#2a3558'; rrect(g, bx - 12, FLOOR - 40, 24, 40, 4); g.fill();          // 土台のクッション
        g.fillStyle = '#ff7a2f'; g.fillRect(bx - 12, FLOOR - 30, 24, 5);
        // ガラスのバックボード
        g.fillStyle = 'rgba(235,245,255,.6)'; rrect(g, bx - 6, top, 12, bot - top, 3); g.fill();
        g.lineWidth = 2.5; g.strokeStyle = '#33425e'; g.stroke();
        g.fillStyle = 'rgba(255,255,255,.4)'; g.beginPath(); g.moveTo(bx - 4, top + 6); g.lineTo(bx + 4, top + 6); g.lineTo(bx - 4, top + 34); g.closePath(); g.fill();
        g.strokeStyle = '#ff5722'; g.lineWidth = 2.5; g.strokeRect(bx - 3.5, y - 50, 7, 42);
      }
      g.strokeStyle = '#b5410f'; g.lineWidth = 4; g.beginPath(); g.ellipse(x, y, rim, 6, 0, Math.PI, Math.PI * 2); g.stroke();
      return;
    }
    const sw = hoopSway, wob = Math.sin(t * 25) * sw * 5, nh = 38 + sw * 10, hw = rim * 0.55;
    const bots = [], tops = [];
    for (let i = 0; i <= 6; i++) { tops.push(L + (R - L) * i / 6); bots.push(x - hw + hw * 2 * i / 6 + wob); }
    g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 1.3;
    for (let i = 0; i < 6; i++) {
      g.beginPath(); g.moveTo(tops[i], y + 2); g.quadraticCurveTo((tops[i] + bots[i + 1]) / 2 + wob, y + nh * 0.5, bots[i + 1], y + nh); g.stroke();
      g.beginPath(); g.moveTo(tops[i + 1], y + 2); g.quadraticCurveTo((tops[i + 1] + bots[i]) / 2 + wob, y + nh * 0.5, bots[i], y + nh); g.stroke();
    }
    g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = 2; g.beginPath(); g.moveTo(bots[0], y + nh); g.lineTo(bots[6], y + nh); g.stroke();
    g.strokeStyle = '#ff5a14'; g.lineWidth = 5; g.beginPath(); g.ellipse(x, y, rim, 6, 0, 0, Math.PI); g.stroke();
    g.strokeStyle = '#ffb27a'; g.lineWidth = 1.5; g.beginPath(); g.ellipse(x, y - 0.5, rim - 1, 5, 0, 0.2, Math.PI - 0.2); g.stroke();
    g.fillStyle = '#ff5a14'; g.beginPath(); g.arc(L, y, 3.8, 0, Math.PI * 2); g.fill(); g.beginPath(); g.arc(R, y, 3.8, 0, Math.PI * 2); g.fill();
    if (bs) { g.fillStyle = '#ff5a14'; g.fillRect(Math.min(R, bs[0]), y - 3, Math.abs(bs[0] - R), 6); g.fillStyle = '#ffb27a'; g.fillRect(Math.min(R, bs[0]), y - 3, Math.abs(bs[0] - R), 2); }
    if (stage.hoop.period) text(g, stage.hoop.dy ? '⇕' : '⇔', x, y - 108, 14, '#ffe082');
  }

  function drawBall(g, x, y, ang, alpha = 1, r = BALL_R) {
    g.save(); g.globalAlpha = alpha; g.translate(x, y);
    const grd = g.createRadialGradient(-r * 0.35, -r * 0.4, 1, 0, 0, r * 1.05);
    grd.addColorStop(0, '#ffb870'); grd.addColorStop(0.55, '#e8641c'); grd.addColorStop(1, '#a8380a');
    g.fillStyle = grd; g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill();
    g.save(); g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.clip(); g.rotate(ang);
    g.strokeStyle = '#2a1004'; g.lineWidth = Math.max(1, r * 0.1);
    g.beginPath(); g.moveTo(-r, 0); g.lineTo(r, 0); g.moveTo(0, -r); g.lineTo(0, r); g.stroke();
    g.beginPath(); g.arc(-r * 1.3, 0, r * 0.95, -1, 1); g.stroke();
    g.beginPath(); g.arc(r * 1.3, 0, r * 0.95, Math.PI - 1, Math.PI + 1); g.stroke();
    g.restore();
    g.strokeStyle = '#2a1004'; g.lineWidth = Math.max(1, r * 0.1); g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(-r * 0.38, -r * 0.45, r * 0.28, r * 0.17, -0.7, 0, Math.PI * 2); g.fill();
    g.restore();
  }

  function drawShooter(g) {
    const x = stage.shooter;
    let sy = 1, sx = 1, up = 0;
    if (jumpT > 0) { const k = jumpT / 0.5; up = Math.sin(k * Math.PI) * 24; sy = 1 + Math.sin(k * Math.PI) * 0.08; sx = 2 - sy; }
    const v = aimVel(); if (v) { sy = 1 - v.power * 0.12; sx = 1 + v.power * 0.1; }
    g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(x, FLOOR + 4, 28 - up * 0.3, 6, 0, 0, Math.PI * 2); g.fill();
    // ポーズ: ふだん=1 ／ ひっぱっているとき=2 ／ 放したあとのジャンプ=3→4の順（前半が3、後半が4）、そのあとは1にもどる（parts/basketball/ の絵。体の大きさは、いままでの丸い体と同じにそろえてある）
    const pose = jumpT > 0.25 ? 3 : jumpT > 0 ? 4 : (aim ? 2 : 1), im = IMG['basketball/basket' + pose], s = 0.14;
    g.save(); g.translate(x, FLOOR - up); g.scale(sx, sy);
    g.drawImage(im, -295 * s, -610 * s, 640 * s, 640 * s);   // 絵の中の体の中心 x≈295、足元 y≈610
    g.restore();
  }

  function drawGuide(g) {
    if (!aim) return;
    const v = aimVel();
    g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 3; g.setLineDash([4, 6]);
    g.beginPath(); g.moveTo(aim.sx, aim.sy); g.lineTo(aim.x, aim.y); g.stroke(); g.setLineDash([]);
    g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.arc(aim.sx, aim.sy, 6, 0, Math.PI * 2); g.fill();
    if (!v) return;
    // 軌道の点線は、いちばん高いところ（最高点）まで。そこから先は自分の目で読む
    const g0 = S.guide(stage, v.vx, v.vy, stageT), lim = guideDots(), full = lim >= 99;
    let ai = 0; g0.pts.forEach((q, i) => { if (q[1] < g0.pts[ai][1]) ai = i; });
    const pts = g0.pts.slice(0, ai + 1), hit = g0.hit && ai === g0.pts.length - 1;
    for (let i = 2, n = 0; i < pts.length && n < lim; i += 2, n++) {
      g.fillStyle = `rgba(255,255,255,${0.95 - i / pts.length * 0.45})`;
      g.beginPath(); g.arc(pts[i][0], pts[i][1], 3, 0, Math.PI * 2); g.fill();
    }
    if (hit && full) { const [hx, hy] = pts[pts.length - 1]; g.strokeStyle = '#ffe082'; g.lineWidth = 2.5; g.beginPath(); g.arc(hx, hy, 9, 0, Math.PI * 2); g.stroke(); }
    rrect(g, stage.shooter - 28, FLOOR + 12, 56, 7, 3.5); g.fillStyle = 'rgba(0,0,0,.4)'; g.fill();
    rrect(g, stage.shooter - 28, FLOOR + 12, 56 * v.power, 7, 3.5); g.fillStyle = v.power > 0.95 ? '#ff7043' : '#ffd54f'; g.fill();
  }

  function drawHud(g) {
    g.save(); g.translate(-ox, 0);          // 左の表示は画面の左はしへ
    rrect(g, 8, 8, 150, 46, 12); g.fillStyle = 'rgba(0,0,0,.4)'; g.fill();
    if (mode === 'stage') {
      text(g, `${Math.floor(stageNo / PER) + 1}-${stageNo % PER + 1}`, 20, 31, 24, '#fff', null, 'left');
    } else {
      text(g, String(score), 44, 31, 26, '#fff', null);
      text(g, '点', 84, 36, 12, '#ffe082', null);
      text(g, `ベスト ${best}`, 118, 31, 11, '#ddd', null);
    }
    for (let i = 0; i < 3; i++) drawBall(g, 176 + i * 26, 31, 0, i < balls ? 1 : 0.2, 10);
    if (mode === 'endless' && streak >= 2) text(g, `${streak}連続`, 270, 31, 14, '#ffd54f');
    g.restore();
    shifted(g, ox, () => {
    button(g, W - 104, 8, 44, 40, () => { scene = mode === 'stage' ? 'select' : 'title'; aim = null; }, (cx, cy) => {
      g.fillStyle = '#3a2a10'; for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) { rrect(g, cx + i * 8 - 3, cy + j * 8 - 3, 6, 6, 1.5); g.fill(); }
    });
    button(g, W - 54, 8, 44, 40, () => { mode === 'stage' ? playStage(stageNo) : playEndless(); }, (cx, cy) => {
      g.strokeStyle = '#3a2a10'; g.lineWidth = 3; g.lineCap = 'round';
      g.beginPath(); g.arc(cx, cy, 10, -Math.PI * 0.2, Math.PI * 1.45); g.stroke();
      g.fillStyle = '#3a2a10'; g.beginPath(); g.moveTo(cx + 11, cy - 12); g.lineTo(cx + 12, cy - 2); g.lineTo(cx + 3, cy - 5); g.closePath(); g.fill();
    });
    });
  }

  function drawGame(g) {
    g.save();
    if (shake > 0) g.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
    drawBg(g);
    drawCeiling(g);
    drawWalls(g);
    drawHoop(g, false);
    // 手に持っている間は、ボールを先に描いて、はなりきし（鼻）を手前にする。飛んでいる間は、ボールを手前にする
    const drawBallPart = () => {
      if (ball) {
        if (ball.flying) ball.trail.forEach(([x, y], i) => { g.fillStyle = `rgba(255,170,80,${i / ball.trail.length * 0.25})`; g.beginPath(); g.arc(x, y, BALL_R * (0.4 + i / ball.trail.length * 0.5), 0, Math.PI * 2); g.fill(); });
        drawBall(g, ball.x, ball.y, ball.ang);
      }
    };
    const held = ball && !ball.flying;
    if (held) drawBallPart();
    drawShooter(g);
    if (!held) drawBallPart();
    drawHoop(g, true);
    drawGuide(g);
    for (const p of parts) {
      g.save(); g.globalAlpha = 1 - p.t / p.life;
      if (p.zab) { g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; rrect(g, -8, -6, 16, 12, 3); g.fill(); }
      else { g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, 3, 0, Math.PI * 2); g.fill(); }
      g.restore();
    }
    for (const p of pops) {
      const a = Math.min(1, (1.2 - p.t) * 3), s = 1 + Math.max(0, 0.15 - p.t) * 3;
      g.save(); g.globalAlpha = a; g.translate(p.x, p.y - p.t * 40); g.scale(s, s);
      text(g, p.text, 0, 0, p.miss ? 20 : 26, p.miss ? '#90caf9' : '#ffe082');
      if (p.sub) text(g, p.sub, 0, 24, 13, '#fff');
      g.restore();
    }
    g.restore();
    drawHud(g);
    if (flash > 0) { g.fillStyle = `rgba(255,255,255,${flash})`; fullRect(g); }
    if (scene === 'play' && shotNo === 0 && !aim && (mode === 'endless' || stageNo === 0)) {
      const k = (t % 1.6) / 1.6, h = S.ballHome(stage);
      text(g, '引っぱって、はなしてシュート！', W / 2, 90, 20, '#fff');
      g.save(); g.globalAlpha = 1 - k * 0.5; text(g, '👆', h.x + 70 - k * 50, h.y + 10 + k * 50, 28, '#fff', null); g.restore();
    }
  }

  function panel(g, a) {
    g.fillStyle = `rgba(15,8,25,${0.6 * a})`; fullRect(g);
    rrect(g, W / 2 - 170, 70, 340, 290, 20); g.fillStyle = 'rgba(255,248,220,.97)'; g.fill(); g.lineWidth = 3; g.strokeStyle = '#3a2a10'; g.stroke();
  }
  function drawClear(g) {
    const a = Math.min(1, endT * 4); g.save(); g.globalAlpha = a; panel(g, a);
    text(g, 'ゴール！', W / 2, 108, 30, '#c62828', null);
    for (let i = 0; i < 3; i++) { const on = i < starsGot && endT >= 0.5 + i * 0.25; star(g, W / 2 + (i - 1) * 64, 168 - (i === 1 ? 10 : 0), 26, on); }
    text(g, ['3球目で決めた', '2球目で決めた', '1球目で決めた！'][starsGot - 1] || '', W / 2, 222, 14, '#6b5530', null);
    g.restore();
    if (endT > 0.6) {
      const hasNext = stageNo + 1 < STAGES.length;
      button(g, W / 2 - 140, 248, 280, 48, () => hasNext ? playStage(stageNo + 1) : (scene = 'select'), hasNext ? '次のステージ ▶' : 'ステージ選択へ', '#9dffb0', 20);
      button(g, W / 2 - 140, 304, 134, 42, () => playStage(stageNo), 'もう一回', '#fff', 16);
      button(g, W / 2 + 6, 304, 134, 42, () => { scene = 'select'; page = Math.floor(stageNo / PER); }, 'ステージ', '#fff', 16);
    }
  }
  function drawFail(g) {
    const a = Math.min(1, endT * 4); g.save(); g.globalAlpha = a; panel(g, a);
    text(g, '3球とも外れ…', W / 2, 120, 28, '#3b5bb5', null);
    drawSumo(g, sprite(YOKO.body, YOKO.belt), 'hit', W / 2, 200, 34);
    g.restore();
    if (endT > 0.5) {
      button(g, W / 2 - 140, 256, 280, 48, () => playStage(stageNo), 'もう一回', '#ffe08a', 20);
      button(g, W / 2 - 140, 310, 280, 40, () => { scene = 'select'; page = Math.floor(stageNo / PER); }, 'ステージ選択へ', '#fff', 16);
    }
  }
  function drawOver(g) {
    const a = Math.min(1, endT * 3); g.save(); g.globalAlpha = a; panel(g, a);
    text(g, 'しあい終了！', W / 2, 110, 30, '#7a2a00', null);
    text(g, `${score} 点`, W / 2, 162, 38, '#c62828', null);
    text(g, score >= best && score > 0 ? 'ベスト更新！' : `ベスト ${best}`, W / 2, 214, 16, '#b26a00', null);
    g.restore();
    if (endT > 0.8) {
      button(g, W / 2 - 140, 256, 280, 48, playEndless, 'もう一度', '#9dffb0', 20);
      button(g, W / 2 - 140, 310, 280, 40, () => { scene = 'title'; }, 'タイトルへ', '#fff', 16);
    }
  }

  function drawSelect(g) {
    drawBg(g);
    g.fillStyle = 'rgba(15,8,25,.55)'; fullRect(g);
    text(g, `第${page + 1}章`, W / 2, 34, 22, '#ffe082');
    text(g, `★ ${totalStars()} / ${STAGES.length * 3}`, W / 2, 60, 14, '#fff');
    const COLS = Math.ceil(PER / 2), gx = 350 - (COLS * 100 - 18) / 2;
    for (let k = 0; k < PER; k++) {
      const i = page * PER + k, col = k % COLS, row = Math.floor(k / COLS), x = gx + col * 100, y = 86 + row * 112;
      const open = unlocked(i), st = progress[i] || 0;
      button(g, x, y, 82, 96, () => { if (open) playStage(i); }, (cx, cy) => {
        if (!open) { text(g, '🔒', cx, cy, 22, '#fff', null); return; }
        text(g, `${page + 1}-${k + 1}`, cx, cy - 16, 20, '#3a2a10', null);
        for (let s = 0; s < 3; s++) star(g, cx + (s - 1) * 22, cy + 22, 9, s < st);
      }, open ? (st ? '#fff8dc' : '#fff1b8') : '#8c8273');
    }
    if (page > 0) shifted(g, -ox, () => button(g, 16, 170, 60, 60, () => { page--; }, '◀', '#fff', 22));
    if (page < CHAPTERS.length - 1) shifted(g, ox, () => button(g, W - 76, 170, 60, 60, () => { page++; }, '▶', '#fff', 22));
    shifted(g, ox, () => button(g, W - 60, 10, 46, 40, () => { scene = 'title'; }, '✕', '#fff', 18));
    text(g, `${page + 1} / ${CHAPTERS.length}`, W / 2, 330, 13, '#ddd');
  }

  function drawTitle(g) {
    drawBg(g);
    g.fillStyle = 'rgba(20,10,30,.3)'; fullRect(g);
    text(g, 'はなりきし', 230, 110, 28, '#ffe082', '#3b1a00');
    text(g, 'シュート', 230, 160, 54, '#fff', '#7a2a00');
    const bob = Math.abs(Math.sin(t * 3));
    g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(560, FLOOR + 4, 32, 7, 0, 0, Math.PI * 2); g.fill();
    drawSumo(g, sprite(YOKO.body, YOKO.belt), 'normal', 560, FLOOR - 34 - bob * 4, 32);
    drawBall(g, 572, FLOOR - 96 - bob * 44, t * 4);
    button(g, 110, 210, 240, 56, () => { const first = STAGES.findIndex((s, i) => unlocked(i) && !progress[i]); page = Math.floor(Math.max(0, first) / PER); scene = 'select'; }, (cx, cy) => {
      text(g, 'ステージ', cx, cy - 8, 22, '#3a2a10', null); text(g, `★ ${totalStars()} / ${STAGES.length * 3}`, cx, cy + 15, 12, '#8a6420', null);
    }, '#9dffb0');
    button(g, 110, 278, 240, 50, playEndless, (cx, cy) => {
      text(g, 'エンドレス', cx, cy - 7, 20, '#3a2a10', null); text(g, `3回外したら終わり　ベスト ${best}`, cx, cy + 13, 11, '#8a6420', null);
    }, '#ffe08a');
    shifted(g, ox, () => button(g, W - 60, 10, 46, 40, () => { muted = !muted; try { localStorage.setItem('sumo-shoot-mute', muted ? '1' : '0'); } catch {} }, (cx, cy) => drawSoundIcon(g, cx, cy, 26, !muted, '#3a2a10'), '#fff', 18));
  }

  // 音のオン・オフのマーク（「どすこい！はなりきし」と同じ形。オフは×で、うすくする）
  function drawSoundIcon(g, cx, cy, size, on, color) {
    const k = size / 40;
    g.save(); g.translate(cx - size / 2, cy - size / 2); g.scale(k, k);
    g.globalAlpha *= on ? 1 : 0.45; g.fillStyle = color; g.strokeStyle = color; g.lineWidth = 2.6; g.lineCap = 'round';
    g.fill(new Path2D('M6 15h7l9-8v26l-9-8H6z'));
    g.stroke(new Path2D(on ? 'M27 13a9 9 0 0 1 0 14M31 9a14 14 0 0 1 0 22' : 'M27 14l10 12M37 14 27 26'));
    g.restore();
  }

  function draw() {
    const g = ctx;
    buttons = [];
    if (scene === 'title') return drawTitle(g);
    if (scene === 'select') return drawSelect(g);
    drawGame(g);
    if (scene === 'play') return;
    buttons = [];                       // 結果の画面では、ゲームのボタンは押せない
    if (scene === 'clear') drawClear(g);
    else if (scene === 'fail') drawFail(g);
    else if (scene === 'over') drawOver(g);
  }

  let last = 0;
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000 || 0); last = now;
    update(dt); draw(); requestAnimationFrame(frame);
  }
  if (location.hash === '#debug') window.DBG = { playStage, playEndless, shoot: v => shoot(v), get s() { return { scene, stage, stageT, ball, shot, balls, score }; } };   // テスト用
  resize();
  // 戻る操作（スワイプ・戻るボタン）: 本番中はポーズ。ふだんは前のページへ
  HanaBack.init({ isPlaying: () => scene === 'play' });
  loadImages().then(() => { requestAnimationFrame(frame); })
    .catch(err => { document.body.textContent = err.message; });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
